# Intent model training suite configuration. Paths are relative to
# tools/train-intent/.

gemini:
  # Teacher model for data generation (spec §9.2). Reads GEMINI_API_KEY
  # from the environment — never hardcode keys.
  model: gemini-2.5-flash-lite
  # Paraphrase variants requested per seed template per register.
  variants_per_seed: 6
  max_output_tokens: 4096
  temperature: 0.8      # diversity for paraphrases; labels are verified after
  requests_per_minute: 25

stt_noise:
  # The STT model the app ACTUALLY ships (spec §9.2: train on what STT
  # emits). Path to a whisper.cpp-compatible binary + model on the
  # training box (same medium Nepali fine-tune bundled in the app).
  whisper_cpp: ~/whisper.cpp/build/bin/whisper-cli
  whisper_model: /mnt/nvme2/workspace/projects/parent-assistant/tools/train/models/whisper-medium-ne-q5_1.bin
  # GPU backend: the SAME model in HF form (the GGML above was exported
  # from this checkpoint). Runs in the tools/train venv (torch+cuda).
  hf_model: /mnt/nvme2/workspace/projects/parent-assistant/tools/train/checkpoints/finetune-medium-final
  tts_voice: voices/hi_IN-pratham-medium.onnx   # piper voice (nearest to ne; relative to tools/train-intent/)
  # Absolute path to the piper binary — REQUIRED because the hf backend
  # runs under tools/train/.venv (CUDA) while piper lives here.
  piper_bin: /mnt/nvme2/workspace/projects/parent-assistant/tools/train-intent/.venv/bin/piper
  sample_rate: 16000
  variants_per_utterance: 2

mixture:
  # Final mixture targets (spec §9.2).
  stt_noised: 0.60
  clean_devanagari: 0.25
  romanized_codeswitched: 0.15
  valid_fraction: 0.05
  seed: 42
  # Phase-2 teacher distillation (gen_distill.py): max rows added by the
  # 4B teacher ON TOP of the sizes above. The stt_noised bucket is the
  # scarce supply and anchors the total (already fully used: 2458 distinct
  # transcripts), so the three fractions above govern the NON-distill
  # portion and this add-on deliberately widens the clean side. 0 = off.
  distill_target: 2600

training:
  # QLoRA recipe (spec §9.5) — consumed by the external trainer
  # (axolotl/unsloth), documented here as the single source of truth.
  base_models:
    - google/gemma-3-1b-it
    - Qwen/Qwen3-1.7B
  lora_r: 16
  lora_alpha: 32
  lr: 1.5e-4
  epochs: 3
  bf16: true
  target_modules: all-linear
  max_seq_len: 1536  # template alone is 1201 tok (max row 1410); 1024 truncated every label
  # Iteration-4 determinism (docs/iteration-4-determinism.md): the run
  # seed root — eval_golden_k.py --k 3 trains seeds seed, seed+1, seed+2.
  seed: 42
  # hard = torch.use_deterministic_algorithms, startup-probe verified
  # (auto-downgrades to soft if bf16/bnb cannot honor it); soft = cudnn
  # flags + deterministic cublas reductions only; off = seeds only.
  deterministic: hard

export:
  # llama.cpp checkout used by src/export_gguf.py (convert_hf_to_gguf.py +
  # llama-quantize); overridable via the LLAMA_CPP_DIR env var.
  llama_cpp_dir: ~/llama.cpp
  # Neutral --target dir for converter deps (sentencepiece etc.) that
  # must not be pip-installed into the live training venv.
  convert_deps_dir: ~/.llama-convert-deps
  quant: Q4_K_M
  out_dir: models

gates:
  # Ship gates (spec §10) — eval_golden.py fails non-zero below these.
  closed_intent_accuracy: 0.95
  slot_f1: 0.90
  emergency_recall: 1.00       # hard gate, no compromise
  side_effect_precision: 0.97  # call + send_message
  max_gap_vs_gemini: 0.03
