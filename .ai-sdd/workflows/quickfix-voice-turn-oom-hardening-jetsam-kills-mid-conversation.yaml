version: "1"
name: quickfix-voice-turn-oom-hardening
description: "Hotfix: stop jetsam kills mid-voice-conversation — post-turn eviction policy, pressure-tiered brain pick, warm-start gating, degraded-mode indicator"

defaults:
  overlays:
    hil: { enabled: false }
    # Quickfix runs are owner-directed and carry their own brief: they must
    # never be gated against the root convention requirements lock (a stale
    # root lock once HIL-gated three quickfix runs). The exemption is also
    # keyed on `name: quickfix`; this default states it explicitly and
    # survives a rename.
    traceability:
      root_lock_fallback: false
  max_rework_iterations: 5

tasks:
  implement-fix:
    use: standard-implement
    depends_on: []
    outputs:
      - path: specs/fix-summary.md
    overlays:
      # Project baseline: paired agentic review on all implementation output.
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }

  review-implementation:
    use: review-implementation
    depends_on: [implement-fix]
    exit_conditions:
      - "review.decision == GO"
