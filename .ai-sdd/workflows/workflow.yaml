# ============================================================
# Conversational Nepali Replies — Feature Workflow
# Canonical path: specs/conversational-nepali-replies/workflow.yaml
# Mirror: .ai-sdd/workflows/conversational-nepali-replies.yaml (keep
#         byte-identical; that path is what
#         `ai-sdd run --workflow conversational-nepali-replies` loads)
#
# Generated by /sdd-scaffold (brownfield-feature) then hardened to the
# project's safety-critical baseline. Base: full-feature pipeline, with the
# task set taken from the project workflow (.ai-sdd/workflows/default-sdd.yaml)
# so that this feature does NOT downshift below the project baseline.
#
# CUSTOMISATIONS FROM THE GENERATED FEATURE BASE AND RATIONALE:
#
# 1. Dropped the generated review-l1 gate so the design chain matches the
#    project baseline: design-l1 → design-l2 → review-l2 (the L2 review is
#    the project's single design gate).
#    Reason: the project baseline is the floor for feature workflows;
#    profile-interview / family-contacts-unify established this convention.
#    No owner-approved frozen design exists for this feature (the
#    owner-approved PROPOSAL fixes scope, not design), so the baseline's L1
#    architecture stage applies.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: the feature (a) changes the SAME on-device model that serves the
#    safety-critical intent path (emergency recall 1.00 is a gate, not a
#    metric), and (b) introduces a NEW cloud egress surface — chat
#    conversation content reaches Gemini via the cloud-first chat routing
#    toggle and the grammar-guard escalation path, beyond the recorded
#    exceptions (Open Decision 12 voice transcription, Open Decision 13
#    OCR'd text). A STRIDE threat model is required before implementation.
#    Focus:
#    - Safety-gate regression: the v17 chat variant ships only behind the
#      full gate harness (emergency recall 1.00, abstention >=0.90,
#      closed-intent >=0.95, calibration +/-0.10); the catalog swap is
#      versioned and reversible; command decode determinism (temp-0 + fixed
#      seed + GBNF) is untouched — only chat turns use fixed-seed temp ~0.3
#    - Cloud chat consent/disclosure (OD-12 shape): explicit consent at first
#      cloud chat use, plain-language disclosure, visible indicator,
#      revocable with the local brain as fallback — never blocks chat
#    - Credential + content hygiene: provider key in header only, never in
#      URLs or logs (B2/T-050 binding precedent); conversation content must
#      not reach logs beyond the existing transcript policy; the
#      reply_grammar_flag telemetry event carries NO user content
#    - Guard integrity: the grammar guard verifies and never rewrites (the
#      SpokenReplyPolisher rule "grammar stays the models' job" stands); a
#      guard failure degrades honestly (escalate or safe template), never
#      produces a false success
#    - Data provenance: the SHIP training mix is CC-BY/Apache/MIT + synthetic
#      + own data only; CC BY-NC research layers (IndicDialogue, DailyDialog,
#      PersonaChat, EmpatheticDialogues, the Nepali call-center corpus) must
#      never contaminate a shipped artifact — a provenance manifest is part
#      of the evidence
#    - Prompt discipline: chat templates stay within the 1,024-token budget;
#      seeds/chat_prompt_template.txt byte-mirrors IntentPrompt.buildChat
#
# 3. Kept paired review + confidence threshold 0.85 on implement, and
#    max_rework_iterations 5 (workflow + implement).
#    Reason: project baseline for all implementation output on this codebase;
#    this feature edits the model-serving, decode, polisher, and cloud-routing
#    seams the safety gates cover, where a silent regression is heard by the
#    elderly user as a broken assistant.
#
# 4. Added security-test with a SECURITY-GO exit condition after
#    review-implementation, and final-sign-off with risk_tier T2 (senior
#    human approval) + hil.
#    Reason: project baseline. The release-build log-surface gate
#    `ios/tools/check-release-log-safety.sh` (wired into ios/build.sh) must
#    cover the new chat/routing/guard paths — no conversation content or key
#    material in logs.
#
# 5. define-requirements keeps HIL (owner approves the feature story) at
#    risk_tier T1 rather than the project's T2: the owner-approved proposal
#    (2026-10-14,
#    `docs/features/2026-10-14-conversational-nepali-replies-proposal.md`,
#    "please implement this as ai-sdd feature spec") is settled input, not a
#    new physical-safety path. The T2 human gate sits at final-sign-off
#    (profile-interview / spotify / multi-turn / call-dialer convention).
#
# PHASING (from the approved proposal): P0 runtime items are individually
# small and may land as a normal PR first; this feature run covers the full
# P0 → P1 → P2 scope, P0 first. The P1 training run executes on the training
# box (anjan-ubuntu, 4090) — training artifacts (corpus, GGUF) are build
# artifacts, not app changes; the catalog swap ships only behind the gates.
# ============================================================

version: "1"
name: conversational-nepali-replies
description: "Conversational Nepali replies: make the brain/reply models conversational, human-like, and grammatically correct (Nepali conversation style spec; P0 runtime decode/persona/grammar-guard/cloud-chat routing; P1 chat-aware v17 QLoRA fine-tune over license-safe conversation data; P2 polish) — the single-decode schema and all safety gates unchanged"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record (from the owner-approved proposal): P0 — persona upgrade
    # in chatSystemPrompt/replyPersona from a single Nepali conversation style
    # spec (register/honorifics, particles budget, small-talk repertoire,
    # code-switched health/tech nouns, forbidden AI-isms); fixed-seed temp
    # ~0.3 for chat turns only; a deterministic Nepali grammar guard at the
    # polisher seam (verify-never-rewrite; flag → escalate to the cloud
    # persona or a safe template + reply_grammar_flag telemetry); a
    # cloud-first chat routing toggle (online → Gemini chat with the upgraded
    # persona, local brain fallback; consent + visible indicator in the OD-12
    # shape); explicit Gemini chat temperature. P1 — a chat-aware v17 QLoRA
    # variant of tools/train-intent (70% conversation / 30% claw-back;
    # Layers 1–4 per the proposal, ~30–60k clean turns; Qwen3-1.7B default,
    # 4B via the per-device resolver; new eval/chat_golden.jsonl + gates;
    # GGUF + catalog swap only behind the gates). P2 — DPO on judge
    # preferences, romanized-Nepali chat, 4B tier, consent-based real
    # transcripts.
    # Explicit non-goals (must not change): the single-decode schema
    # (one JSON: intent + response + confidence); the router ladder and
    # emergency gate behavior; STT behavior (the speech pipeline is
    # untouched); command-turn decode determinism (temp-0 + fixed seed +
    # GBNF); any new device permission.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]
    # Architect must resolve/design: the style-spec artifact
    # (seeds/nepali-chat-style-spec) as the single source of truth and every
    # consumer seam (personas, data-generation prompts, eval rubric, grammar
    # guard); the chat decode seam (fixed-seed temp ~0.3 for chat ONLY, with
    # reproducibility tests; commands keep temp-0 + fixed seed + GBNF);
    # the grammar-guard contract (deterministic checks incl. तिमी/तपाईं–verb
    # agreement, Devanagari purity, dangling particles; verify-never-rewrite;
    # escalation path; telemetry with no user content); the cloud-first chat
    # routing toggle shape (consent state, disclosure copy seam, visible
    # indicator, offline fallback; the OD-12-shape amendment); the Gemini
    # chat temperature config seam; the v17 training-suite extension (data
    # layers, mixture, filters, provenance manifest, gate-harness extension,
    # catalog entry + rollback path); the DV protocol on Anzaan (local,
    # cloud-online, offline, emergency phrasing, command determinism,
    # listening panel). Feasibility honesty: if any leg is not feasible
    # (e.g. GBNF interplay with non-zero temperature, or determinism of
    # fixed-seed 0.3 across device tiers), the design records it explicitly
    # for the owner — no silent drop.

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas: safety-gate regression on the shared
    # model + catalog-swap discipline (versioned, reversible, gates green
    # before ship); the new cloud chat egress (consent/disclosure in the
    # OD-12 shape; key in header only, never URLs or logs — B2/T-050
    # precedent; conversation content off the logs; reply_grammar_flag
    # carries no user content); guard integrity (verify-never-rewrite;
    # honest degradation on guard failure); training-data provenance (ship
    # mix CC-BY/Apache/MIT + synthetic + own data only — no CC BY-NC
    # contamination of a shipped artifact); prompt discipline (1,024-token
    # budget; seeds/chat_prompt_template.txt byte-mirrored to
    # IntentPrompt.buildChat).
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: emergency recall stays 1.00 and command decode stays
    # deterministic after the chat changes (temp-0/seed/GBNF untouched on
    # the command path); chat turns are reproducible at fixed-seed temp ~0.3;
    # the grammar guard never rewrites and its escalation degrades honestly;
    # the cloud chat path enforces consent + visible indicator and never
    # leaks the provider key or conversation content into logs
    # (check-release-log-safety.sh coverage of the new paths); the ship-mix
    # provenance manifest proves no CC BY-NC source; the chat templates stay
    # within the pinned token budget and the seed mirror is byte-identical.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # DV-* device validation on Anzaan is part of the completion gate:
    # DV-1 — local chat: warm, grammatical replies (honorific agreement, no
    #        AI-isms) from the shipped tier;
    # DV-2 — cloud-first chat: consent + visible indicator work; toggling
    #        off returns to the on-device brain without losing chat;
    # DV-3 — offline chat degrades honestly to the local brain (no crash,
    #        no false success);
    # DV-4 — emergency phrasing still triggers exactly (recall untouched on
    #        device);
    # DV-5 — command determinism unchanged (e.g. reminders/alarms at temp-0
    #        behaviors);
    # DV-6 — elderly listening panel A/B verdict recorded.
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
