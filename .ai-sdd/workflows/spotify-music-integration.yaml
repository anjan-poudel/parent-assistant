# Spotify Music Integration — Feature Workflow
# Canonical path: specs/spotify-music-integration/workflow.yaml
# Mirror: .ai-sdd/workflows/spotify-music-integration.yaml (keep byte-identical;
#         that path is what `ai-sdd run --workflow spotify-music-integration` loads)
#
# Generated by /sdd-scaffold (brownfield-feature) then hardened to the
# project's safety-critical baseline. Base: full-feature pipeline, with the
# task set taken from the project workflow (.ai-sdd/workflows/default-sdd.yaml)
# so that this feature does NOT downshift below the project baseline.
#
# CUSTOMISATIONS FROM THE GENERATED FEATURE BASE AND RATIONALE:
#
# 1. Dropped the generated review-l1 gate so the design chain matches the
#    project baseline: design-l1 → design-l2 → review-l2 (the L2 review is
#    the project's single design gate).
#    Reason: the project baseline is the floor for feature workflows;
#    profile-interview established this convention.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: the feature introduces a new outbound network integration with
#    user account linking (constitution amendment 2026-10-06) and an
#    app-held OAuth credential surface. A STRIDE threat model is required
#    before implementation. Focus areas:
#    - OAuth token lifecycle: scopes at sign-in, Keychain/EncryptedLocalStorage
#      at rest, refresh handling, revocation on unlink; no tokens in logs
#      (B2 / T-050 release-log-gate precedent)
#    - Client-secret handling for the client-credentials search flow (OD-S1):
#      bundled secrets are extractable; the family-entered credential per the
#      SearchConfigStore precedent is the candidate pattern
#    - Deep-link/URI injection: spotify: URIs are built from remote-controlled
#      search results — track names/IDs must be validated before URI
#      construction; a crafted result must not open arbitrary schemes
#    - OAuth redirect validation: reject mismatched redirect URIs
#      (token interception via app-scheme hijacking)
#    - Log sanitisation: music queries, provider responses and error bodies
#      must not reach logs (check-release-log-safety.sh coverage)
#    - Privacy disclosure: music-query/playback data flow to Spotify disclosed
#
# 3. Kept paired review + confidence threshold 0.85 on implement, and
#    max_rework_iterations 5 (workflow + implement).
#    Reason: project baseline for all implementation output on this codebase.
#
# 4. Added security-test with a SECURITY-GO exit condition after
#    review-implementation, and final-sign-off with risk_tier T2 (senior
#    human approval) + hil.
#    Reason: project baseline. The release-build log-surface gate
#    `ios/tools/check-release-log-safety.sh` (wired into ios/build.sh)
#    must cover the new Spotify tool + account-linking paths.
#
# 5. define-requirements keeps HIL (owner approves the feature story)
#    at risk_tier T1 rather than the project's T2: the feature adds no
#    physical-safety path — it plays user-requested music; no emergency-call,
#    medication, or health-alert surface changes. The T2 human gate sits at
#    final-sign-off, matching the profile-interview convention.
# ============================================================

version: "1"
name: spotify-music-integration
description: "Voice-requested music playback: both-provider search with Spotify preferred when linked and capable, Spotify account linking, honest degradation (Premium NFR, spotify: deep-link fallback, YouTube fallback)"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: replace the music stub (router.musicStub) with real
    # playback; both providers searched with Spotify winning whenever linked
    # and capable; explicit YouTube requests unchanged; Premium NFR with
    # spotify: deep-link fallback and honest localized lines for free-tier /
    # unlinked / network-failure / empty-search; account linking by the
    # caregiver (GoogleAccountSession OAuth precedent); constitution
    # amendment 2026-10-06 (Constraint 1 + Required integrations) is part of
    # the change set. Open decisions OD-S1..S3 carry into design.
    # Explicit non-goals: brain/router model changes, new backend, cloud LLM
    # on the music path, emergency/meds/health surface changes.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]
    # Architect must resolve: OD-S1 (client-secret handling for
    # client-credentials search), OD-S3 (Premium degradation precedence —
    # constraint 1 vs constraint 5: free-tier deep-link vs YouTube fallback),
    # and address OD-S2 (dev-mode rollout / quota-extension plan) as an
    # owner/architect decision. Also: musicStub replacement at
    # CommandRouter.swift:2640, YouTubeRoute fall-through interplay,
    # SpotifyTool seams (configStore/transport/linkOpener pattern),
    # GoldenCorpus pinned-stub churn (lines 142–157).

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas for this feature:
    # - OAuth token lifecycle (scopes at sign-in, Keychain/EncryptedLocalStorage
    #   at rest, refresh, revocation on unlink; no tokens in logs — B2/T-050)
    # - Client-secret handling for the client-credentials search flow (OD-S1);
    #   bundled secrets are extractable
    # - Deep-link/URI injection: spotify: URIs built from remote-controlled
    #   search results must be validated (no arbitrary scheme opens)
    # - OAuth redirect-URI validation (token interception via scheme hijack)
    # - Log sanitisation: music queries, provider responses, error bodies
    # - Privacy disclosure: query/playback data flow to Spotify disclosed
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: token storage (Keychain/encrypted only), release log-surface
    # coverage of the new Spotify paths (check-release-log-safety.sh),
    # hostile track titles/IDs producing only validated spotify: URIs,
    # OAuth redirect validation, credential wipe on unlink.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
