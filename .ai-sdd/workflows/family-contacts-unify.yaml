#    so the baseline's L1 architecture stage applies.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: the feature introduces the app's FIRST WRITE surface into the
#    shared system address book (CNContactStore / CNSaveRequest — today
#    read-only), links family and system identities (a wrong link dials the
#    wrong person), and extends nickname matching into voice call resolution
#    (an ambiguous match must never silently pick the wrong person for an
#    elderly user). A STRIDE threat model is required before implementation.
#    Focus:
#    - Write authority blast radius: CNSaveRequest confined to the edited
#      contact's photo; never a bulk rewrite; never another contact; the
#      authorization states (full / limited / denied) are handled honestly
#    - Identity integrity: link/unlink semantics; wrong-contact writes and
#      wrong-person resolutions prevented; ambiguity resolves conservatively
#    - Degradation safety: permission denied / limited / read-only contact
#      falls back to the app-local photo (ContactPhotoStore) with honest UI —
#      no data loss, no false success, no crash
#    - PII: names/numbers/photos must not reach logs beyond the existing
#      transcript policy (B2/T-050); no new egress (nothing leaves the device)
#
# 3. Kept paired review + confidence threshold 0.85 on implement, and
#    max_rework_iterations 5 (workflow + implement).
#    Reason: project baseline for all implementation output on this codebase;
#    this feature edits contact identity and the call-resolution seam, where a
#    silent regression strands calls on the wrong person.
#
# 4. Added security-test with a SECURITY-GO exit condition after
#    review-implementation, and final-sign-off with risk_tier T2 (senior
#    human approval) + hil.
#    Reason: project baseline. The release-build log-surface gate
#    `ios/tools/check-release-log-safety.sh` (wired into ios/build.sh) must
#    cover the new write/fallback/resolution paths.
#
# 5. define-requirements keeps HIL (owner approves the feature story) at
#    risk_tier T1 rather than the project's T2: the owner has requested the
#    three asks with pre-authorized feasibility fallbacks (photo fallback
#    explicit; "if not feasible, tell the owner"), so the story is settled
#    input, not a new physical-safety path. The T2 human gate sits at
#    final-sign-off (profile-interview / spotify / multi-turn / call-dialer
#    convention).
#
# SEQUENCING (owner constraint — distinct from call-dialer):
# call-dialer-primary-secondary (branch feat/call-dialer-primary-secondary)
# is in flight and touches the same Contacts surface (MethodResolver.swift,
# LeafViews.swift, AppCoordinator.swift, CallingSettingsView.swift). This
# feature is EXPLICITLY DISTINCT and must not absorb or redesign it.
# Implementation merges master AFTER call-dialer's PR merges (queue behind
# it) before implementation starts; expected conflicts in MethodResolver.swift
# / LeafViews.swift family-contact call surfaces.
