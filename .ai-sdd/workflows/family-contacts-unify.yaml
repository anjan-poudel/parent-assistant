# CUSTOMISATIONS FROM THE GENERATED FEATURE BASE AND RATIONALE:
#
# 1. Dropped the generated review-l1 gate so the design chain matches the
#    project baseline: design-l1 → design-l2 → review-l2 (the L2 review is
