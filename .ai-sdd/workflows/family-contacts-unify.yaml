version: "1"
name: family-contacts-unify
description: "Family contacts unify: link a system contact as a family contact (one person, never two rows), bidirectional photo unification with an app-local fallback when the system contact is not writable, and multiple indexed nicknames/name variations (Devanagari included) that match in search and voice resolution"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: the three owner asks with their pre-authorized
    # feasibility fallbacks — (1) LINK a system contact as a family contact
    # (a linked pair is ONE person everywhere: search, call list, voice
    # resolution; dedupe becomes link-aware beyond today's matched-only
    # normalized-number rule; unlinked pairs keep today's matched-only
    # behavior); (2) PHOTO unification — setting a photo in the app updates
    # the system contact via CNContactStore/CNSaveRequest when permitted,
    # system-contact photos are displayed when present, and when the system
    # contact is not writable (permission denied / limited access /
    # read-only) the photo stays app-local exactly as today
    # (ContactPhotoStore photoFilename) with honest UI — no silent loss, no
    # false success; (3) NICKNAMES — multiple nicknames/name variations per
    # family contact (e.g. sanu, syanu, Devanagari forms), INDEXED, matched
    # by name OR any nickname/variation in BOTH in-app search and voice call
    # resolution, reusing the existing name-matching semantics
    # (NepaliTextNormalizer folding + caseInsensitive/diacriticInsensitive
    # Character-safe substring; Devanagari grapheme behavior
    # regression-pinned; no automatic transliteration). Model changes follow
    # the house migration rule (optional fields, decoder defaults; the
    # existing single nickname migrates without loss). ne/en copy for all
    # new UI.
    # Explicit non-goals: redesigning call-dialer-primary-secondary; bulk
    # address-book sync; editing system-contact fields other than the photo;
    # auto-transliteration/romanization; per-contact ownership across
    # devices; any new network surface.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]
    # Architect must resolve/design: the link's storage on FamilyContact and
    # its migration (system-contact identifier stability across re-syncs;
    # link/unlink edge cases; identifier lookup failure handling); the
    # link-aware dedupe contract in UnifiedContactSearch (and every surface
    # where the pair could render twice); the system-contact WRITE seam
    # (CNContactStore authorization incl. limited access; CNSaveRequest
    # confined to the edited contact's photo; injectable for tests — the
    # house pure-static seam pattern); the multi-nickname model + index
    # (structure, normalized search keys, legacy-decoder migration of the
    # existing single nickname without loss); the match-order rule's
    # integration into FamilyMatchTier and the voice seams
    # (ContactResolver/MethodResolver) with deterministic, conservative
    # ambiguity handling (a nickname matching several contacts must never
    # silently dial the wrong person); photo display precedence and the
    # fallback state machine (when the app-local file is kept vs removed;
    # honest UI on failed writes); UI surfaces (family editor photo setter
    # and nickname management; search results and call list rendering the
    # linked pair as one row); ne/en catalog entries; the call-dialer
    # merge/sequencing plan (MethodResolver.swift / LeafViews.swift).
    # Feasibility honesty: if any of the three asks is not feasible on the
    # target iOS (e.g. the write-permission model), the design records it
    # explicitly for the owner — no silent drop.

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas: the new write authority into the shared
    # system address book (CNSaveRequest blast radius confined to the edited
    # contact's photo; no bulk mutation; a wrong-contact write is prevented,
    # not just detected); identity integrity (wrong link / wrong nickname
    # resolution dials the wrong person — ambiguity must resolve
    # conservatively and deterministically; unlink semantics defined);
    # degradation safety (permission denied/limited or save failure falls
    # back to the app-local photo with honest UI — no loss, no false
    # success); PII discipline (names/numbers/photos off the logs beyond
    # B2/T-050); no new egress (nothing leaves the device).
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: write-failure and permission-denied paths never lose the picked
    # photo and never claim an unverified success (the owner-sanctioned
    # app-local fallback works); a linked pair never surfaces twice across
    # search (matched AND unmatched queries), the call list, and voice
    # resolution; nickname matching order (exact name strongest; nicknames
    # conservative) with deterministic ambiguity handling; Devanagari
    # substring behavior regression-pinned (no grapheme "fixes"); pre-field
    # store payloads (single nickname, photoFilename) load and migrate
    # without loss; number/name PII does not reach logs
    # (check-release-log-safety.sh coverage of the new paths); no new egress.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # DV-* device validation on Anzaan is part of the completion gate:
    # DV-1 — link a system contact as a family contact → the person appears
    #        ONCE in search results and the call list (matched and unmatched
    #        queries);
    # DV-2 — voice: "call <nickname>" (incl. a Devanagari variation) reaches
    #        the right person; an ambiguous nickname never dials the wrong
    #        person;
    # DV-3 — photo: setting a photo in the app updates the system contact
    #        when permission allows; the displayed photo reflects the system
    #        contact;
    # DV-4 — fallback: with write access denied/limited (or a read-only
    #        system contact) the photo stays app-local as today, honestly
    #        surfaced — no loss, no crash;
    # DV-5 — search by name and by each recorded nickname/variation
    #        (Devanagari included) finds the single linked row;
    # DV-6 — existing installs: contacts saved before the change keep
    #        loading; the pre-change single nickname still matches.
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
