# ============================================================
# Live Camera Translation — Feature Workflow
# Canonical path: specs/live-camera-translation/workflow.yaml
# Mirror: .ai-sdd/workflows/live-camera-translation.yaml (keep byte-identical;
#         that path is what `ai-sdd run --workflow live-camera-translation` loads)
#
# Generated by /sdd-scaffold (brownfield-feature) then hardened to the project's
# safety-critical baseline. Base: 02-agile-feature.yaml, with the task set taken
# from the project workflow (.ai-sdd/workflows/default-sdd.yaml) so that this
# feature does NOT downshift below the project baseline.
#
# CUSTOMISATIONS FROM THE AGILE-FEATURE BASE AND RATIONALE:
#
# 1. Added design-component + review-l2 after define-requirements.
#    Reason: the feature's source of truth is a first-pass component design that
#    is owner-approved but explicitly "awaiting spec review"
#    (docs/superpowers/specs/2026-09-16-live-camera-translation-design.md).
#    Its §10 Open Decisions and §11 divergences (D1, D2) are inputs to be folded
#    into a reviewable L2 design, not settled architecture.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: this feature adds a camera permission and a NEW CLOUD EGRESS PATH
#    (OCR'd text -> Gemini tier 2). The project constitution requires a STRIDE
#    threat model before implementation when new security-sensitive surfaces are
#    introduced. Focus areas: prompt injection via scene text (OCR text is
#    untrusted input), consent-gate bypass, cache persistence of user content,
#    accidental image egress.
#
# 3. Kept paired review on implement (driver dev, challenger reviewer).
#    Reason: project baseline for all implementation output on this codebase.
#
# 4. Kept confidence threshold 0.85 on implement.
#    Reason: project baseline (elevated from the 0.80 default).
#
# 5. Added security-test with a SECURITY-GO exit condition, after
#    review-implementation. Reason: the tier-2 path must be evidenced as
#    consent-gated, text-only, and log-safe before sign-off. The release-build
#    log-surface gate `ios/tools/check-release-log-safety.sh` (wired into
#    ios/build.sh) must cover the new OCR/translation text paths.
#
# 6. Added final-sign-off with risk_tier T2 (senior human approval) and hil.
#    Reason: it is the gate where two owner actions are verified before the
#    feature is shippable — (a) the recorded constitution exception amendment
#    for the text-only cloud translation tier (Open Decision 13, recorded
#    2026-09-16), and
#    (b) the consent/disclosure copy + NSCameraUsageDescription review.
#    Constraint from the brief: the cloud tier must NOT ship before the
#    amendment is recorded.
#
# 7. max_rework_iterations 5 (workflow and implement), from project baseline.
# ============================================================

version: "1"
name: live-camera-translation
description: "Live camera translation (EN->NE v1) — point-and-augment overlay; new camera + cloud-text-egress surface"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    # T1 rather than the project's T2 — this feature adds no physical-safety
    # path (no emergency call, medication, or health-alert surface). The T2
    # human gate sits at final-sign-off, where the exception amendment and the
    # consent copy are verified.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: v1 = English source -> Nepali target, voice-invokable
    # plugin, dictionary + consent-gated text-only cloud tiers, smart-mix
    # overlay. Explicit non-goals: NE->EN, ARKit anchoring, auto-speak, live
    # full-scene explanation, on-device NMT (v1.1).

  design-component:
    use: design-component
    depends_on: [define-requirements]
    # PE folds the owner-approved first-pass design into a reviewable L2
    # component design: interfaces + explicit error return types, failure modes
    # and retryability per async operation, configurable timeouts. Must carry
    # forward the documented divergences D1 (smart-mix overlay) and D2 (on-device
    # NMT deferred to v1.1) and resolve §10 Open Decisions that are resolvable
    # on paper.

  review-l2:
    use: review-l2
    depends_on: [design-component]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas for this feature:
    # - Untrusted scene text reaching the cloud prompt (instruction injection
    #   via a malicious label/menu) — same discipline as InputSanitiser treats
    #   transcripts
    # - Consent-gate bypass: any path that reaches tier 2 without recorded,
    #   explicit, revocable consent
    # - Egress leakage: images must never leave the device; only OCR'd text,
    #   and never health/contacts/profile content
    # - Persistent cache = user content at rest: encrypted, keyed, evictable
    # - Cloud indicator spoofing/absence while tier 2 is active
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: consent-gate enforcement (no cloud call without it), text-only
    # egress (no inlineData/images from this pipeline), raw OCR or translation
    # text never reaching logs, offline degradation never silently reporting
    # success, cost governor cap failing closed.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 human gate. Release gates verified here:
    # 1. The recorded exception amendment exists: Open Decision 13 in the
    #    project constitution (recorded 2026-09-16). The cloud tier must not
    #    ship without it — verified here.
    # 2. Consent/disclosure copy and NSCameraUsageDescription are reviewed and
    #    updated (camera purpose string currently does not mention live
    #    translation or the conditional cloud text send).
    # 3. `ios/tools/check-release-log-safety.sh` passes and covers the new
    #    OCR/translation text paths.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
