version: "1"
name: medication-schedules-reminders
description: "Medication schedules & reminders revamp: quantity + time-of-day slot (morning/afternoon/evening) + before/after-meal entry model; purpose at entry; scan-to-fill; voice intake acknowledgement with slot recorded against the day's schedule; photo-as-evidence; caregiver notification of significant events — fit for forgetful elderly users"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    overlays:
      hil: { enabled: true }
    # HIL: the owner approves the feature story before design work starts.
    # Scope to record (owner brief, 2026-10-15): (1) entry model becomes
    # quantity + time-of-day (morning/afternoon/evening) + before/after
    # meal; (2) each medication carries a brief purpose description;
    # (3) camera scan of packaging/label fills the name and schedules,
    # manual entry as before; (4) the elder acknowledges intake in natural
    # voice ("I have taken X for morning before meal") and intake activities
    # are recorded against daily schedules; (5) a photo of the medication
    # serves as intake evidence; (6) caregivers are always notified of
    # significant medication events via caregiver app / calendar events /
    # other channels; (7) core feature — fit for forgetful elderly users.
    # Open decisions 1–3 resolved in the feature constitution
    # (specs/medication-schedules-reminders/constitution.md); ODs 4–8
    # remain for the design chain.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]

  review-l1:
    use: review-l1
    depends_on: [design-l1]

  design-l2:
    use: design-component
    depends_on: [review-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]

  plan-tasks:
    use: plan-tasks
    depends_on: [review-l2]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
      # test cadence (amendment-4, 2026-10-14 owner directive): per-unit work
      # is code + build/typecheck only; each wave closes with ONE
      # consolidated scoped (-only-testing) pass over the wave's touched
      # suites; the single full-suite pass stays at the very end.
    overlays:
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]

  final-sign-off:
    use: final-sign-off
    depends_on: [review-implementation]
    # T2 gate: senior human sign-off before the feature is considered done.
    # DV-* device validation on Anzaan is part of the completion gate:
    # DV-1 — slot-based entry: create a medication with quantity + slot +
    #        before/after meal; the reminder fires at the mapped clock time;
    # DV-2 — scan-to-fill: photograph a label; OCR values require explicit
    #        human confirmation before binding; a partial/failed read
    #        changes nothing and is spoken honestly;
    # DV-3 — voice ack with slot ("I have taken X for morning before meal")
    #        resolves to the correct reminder when several share a slot;
    #        FR-D01 challenge + FR-D03 double-dose order preserved;
    # DV-4 — photo-as-evidence attaches to the intake record (on-device),
    #        never creates a record by itself;
    # DV-5 — caregiver notification: significant events (missed,
    #        double-dose, intake recorded, escalation started) fire; the
    #        consent-gated calendar channel surfaces them; no PII on the
    #        wire;
    # DV-6 — process-kill re-arm: a reminder killed before ack re-fires on
    #        next launch within the unexpired escalation window (FR-029);
    # DV-7 — elderly-fit: 44pt+ targets, 18pt+ body text, voice-first,
    #        spoken times via the SpokenTime formatter only.
    # Release gate: ios/tools/check-release-log-safety.sh must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
