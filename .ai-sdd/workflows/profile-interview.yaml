# ============================================================
# Profile Interview + Address-as — Feature Workflow
# Canonical path: specs/profile-interview/workflow.yaml
# Mirror: .ai-sdd/workflows/profile-interview.yaml (keep byte-identical;
#         that path is what `ai-sdd run --workflow profile-interview` loads)
#
# Generated by /sdd-scaffold (brownfield-feature) then hardened to the
# project's safety-critical baseline. Base: full-feature pipeline, with the
# task set taken from the project workflow (.ai-sdd/workflows/default-sdd.yaml)
# so that this feature does NOT downshift below the project baseline.
#
# CUSTOMISATIONS FROM THE GENERATED FEATURE BASE AND RATIONALE:
#
# 1. Added design-l1 before design-l2 (the generated base had review-l1
#    instead of the project's design-l1 → design-l2 → review-l2 chain).
#    Reason: no owner-approved first-pass design exists for this feature,
#    so the project baseline's L1 architecture stage applies.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: the feature introduces a NEW user-controlled prompt-injection
#    surface — the address-as term (and name) are user-entered text injected
#    into IntentPrompt.build/buildChat/buildUnderstanding, whose templates
#    are shared by the cloud (Gemini) and on-device (LLaMA) brains. A STRIDE
#    threat model is required before implementation. Focus areas:
#    - Instruction injection via a crafted address-as/name string
#      (e.g. an address-as containing prompt instructions)
#    - Profile PII at rest (DOB, emergency contacts, name) — encrypted
#      storage per constitution, log-sanitiser coverage of the new fields
#    - Voice fingerprint enrolment spoofing/replay (reuses the existing
#      SpeakerBiometricService threat model)
#
# 3. Kept paired review + confidence threshold 0.85 on implement, and
#    max_rework_iterations 5 (workflow + implement).
#    Reason: project baseline for all implementation output on this codebase.
#
# 4. Added security-test with a SECURITY-GO exit condition after
#    review-implementation, and final-sign-off with risk_tier T2 (senior
#    human approval) + hil.
#    Reason: project baseline. The release-build log-surface gate
#    `ios/tools/check-release-log-safety.sh` (wired into ios/build.sh)
#    must cover the new profile + wake-acknowledgment paths.
#
# 5. define-requirements keeps HIL (owner approves the feature story)
#    at risk_tier T1 rather than the project's T2: the feature adds no
#    physical-safety path — it collects profile fields and changes how the
#    assistant ADDRESSES the user; no emergency-call, medication, or
#    health-alert surface changes. The T2 human gate sits at final-sign-off.
# ============================================================

version: "1"
name: profile-interview
description: "Onboarding personal interview (name, address-as, DOB, emergency contacts, voice fingerprint) + address-as personalization of spoken replies"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: interview steps (About-you: name + address-as REQUIRED,
    # DOB optional; emergency contacts: next of kin, GP, hospital — optional;
    # family members extends the existing step; voice fingerprint optional via
    # existing enrollment). Address-as is spoken by the assistant on wake-word
    # acknowledgment ("hajur <address-as>") and used naturally in brain replies
    # ("yes <address-as>"). Explicit non-goals: wake-word recognition changes,
    # new cloud processing, emergency-call logic changes, forcing address-as
    # into every sentence.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas for this feature:
    # - Instruction injection via user-entered address-as/name composed into
    #   IntentPrompt templates (cloud + on-device) — same discipline
    #   InputSanitiser applies to transcripts must apply to profile strings
    # - Profile PII at rest: DOB, emergency contacts, name in encrypted local
    #   storage; log sanitiser must cover the new fields (no PII in logs)
    # - Voice fingerprint enrollment spoofing/replay — reuse existing
    #   SpeakerBiometricService threat model
    # - Wake-acknowledgment path: no new egress, no sensitive data in the
    #   spoken greeting beyond the address-as term itself
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: address-as/name prompt injection into IntentPrompt templates,
    # profile PII in logs, encrypted storage verification, voice fingerprint
    # enrollment data at rest.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
