version: "1"
name: call-dialer-primary-secondary
description: "Call dialer primary/secondary preference: settings-level Primary + Fallback dialer pickers (FaceTime/phone/messenger/whatsApp) with a feasibility-aware chain (preferred → fallback → GSM hard floor) across all call paths, announced through the existing multi-turn confirmation"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: two settings sections (Primary dialer, Fallback
    # dialer) over the 4 channels, stored on the AppCoordinator UserDefaults
    # seam (defaultCallApp = primary, new secondaryCallApp = fallback,
    # defaulting to .phone/GSM; equal values allowed, routing dedupes); a
    # pure-static feasibility resolver (messenger ⇔ handle on file; whatsApp ⇔
    # app installed via canOpenURL, injected as a closure for tests;
    # faceTime/phone always feasible); the chain preferred → fallback →
    # phone with fellBackFrom carried in the result; tap paths (address-book
    # rows, family-contact buttons, missed-call dial-back) and the voice path
    # (MethodResolver global-default step → settings primary, mapped
    # CallApp→CallMethod by call type) run the chain; fallback resolves
    # BEFORE the spoken confirmation, which names the actually-routed
    # channel; launch-fail fallback (best-effort) announced via the existing
    # spoken-outcome lane; ne/en copy for announcements + settings labels.
    # Explicit non-goals: a dedicated CallRouter service; per-contact
    # primary/secondary storage; any change to emergency-contact semantics;
    # a new dialogue flow; any new network surface.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]
    # Architect must resolve/design: the feasibility resolver's shape and its
    # injectable seams (canOpenURL closure, handle lookup) for tests; the
    # chain's integration points in resolvedCallChannel /
    # resolvedMissedCallChannel and every tap call site (LeafViews
    # address-book rows ~L1612, family-contact buttons); the MethodResolver
    # global-default replacement and the CallApp→CallMethod mapping per call
    # type (e.g. primary FaceTime + "video" → .facetimeVideo); where the
    # fallback decision sits relative to the confirmation window and
    # PendingCallAction so the confirmation names the routed channel; the
    # announcement strings and their ne/en catalog entries; persistence for
    # existing installs (secondaryCallApp absent → GSM); the launch-fail
    # observation point and its interaction with the spoken-outcome lane.
    # The frozen design doc is the reference; conflicts are recorded
    # amendments, never silent resolutions.

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas: the GSM hard floor can never be
    # configured away (no dead-end chain, including secondary == primary);
    # emergency-contact semantics and the override protocol unchanged
    # (dial-back never delays escalation); feasibility probes are local-only
    # (no new egress; handles/numbers are PII); the spoken confirmation
    # always names the actually-routed channel (fellBackFrom — no silent
    # route changes); log sanitisation of numbers/handles (B2/T-050).
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: the chain never dead-ends for any (primary, fallback) pair,
    # including equal values (dedupe) and uninstalled apps; the GSM floor is
    # reachable with every other channel infeasible; the confirmation wording
    # always names the routed channel; emergency/dial-back escalation is
    # unaffected; number/handle PII does not reach logs
    # (check-release-log-safety.sh coverage of the new paths); no new egress
    # from the feasibility probes.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # DV-* device validation on Anzaan is part of the completion gate
    # (primary→fallback routing when the primary app is missing; GSM floor;
    # spoken announcement wording ne/en; voice-initiated primary routing;
    # missed-call dial-back; settings pickers persistence).
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
