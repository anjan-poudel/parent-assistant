# ============================================================
# Multi-turn Conversation — Feature Workflow
# Canonical path: specs/multi-turn-conversation/workflow.yaml
# Mirror: .ai-sdd/workflows/multi-turn-conversation.yaml (keep byte-identical;
#         that path is what `ai-sdd run --workflow multi-turn-conversation` loads)
#
# Generated by /sdd-scaffold (brownfield-feature) then hardened to the
# project's safety-critical baseline. Base: full-feature pipeline, with the
# task set taken from the project workflow (.ai-sdd/workflows/default-sdd.yaml)
# so that this feature does NOT downshift below the project baseline.
#
# CUSTOMISATIONS FROM THE GENERATED FEATURE BASE AND RATIONALE:
#
# 1. Dropped the generated review-l1 gate so the design chain matches the
#    project baseline: design-l1 → design-l2 → review-l2 (the L2 review is
#    the project's single design gate).
#    Reason: the project baseline is the floor for feature workflows;
#    profile-interview established this convention.
#
# 2. Added security-design-review with a SECURITY-GO exit condition.
#    Reason: the feature edits the voice-turn interception path that
#    front-runs emergency and medication handling, and adds a free-text
#    answer-capture surface mid-dialogue. A STRIDE threat model is required
#    before implementation. Focus areas:
#    - Emergency precedence: emergency keywords must win mid-dialogue;
#      a hostile or corrupted answer must not bypass the override rule
#    - Free-text answer injection: spoken answers enter routing mid-frame;
#      the answer-turn interception must run before the routing ladder and
#      open no new injection surface into the router/intent path
#    - Frame-trap resistance: cancel words, barge-in on a strong new
#      command, and the 45 s timeout must always recover; a frame must
#      never strand the user
#    - Log sanitisation: probe texts and captured answers must not reach
#      logs beyond the existing transcript policy (B2/T-050 precedent)
#    - No new egress: probes and answers stay on-device; the feature adds
#      no provider calls (music-search egress is Spotify-feature owned)
#    - Degraded-brain path: the deterministic merge must not weaken the
#      emergency/safety gates when the brain is absent or evicted
#
# 3. Kept paired review + confidence threshold 0.85 on implement, and
#    max_rework_iterations 5 (workflow + implement).
#    Reason: project baseline for all implementation output on this codebase;
#    this feature edits voice-turn routing core, where a silent regression
#    can strand an elderly user mid-dialogue.
#
# 4. Added security-test with a SECURITY-GO exit condition after
#    review-implementation, and final-sign-off with risk_tier T2 (senior
#    human approval) + hil.
#    Reason: project baseline. The release-build log-surface gate
#    `ios/tools/check-release-log-safety.sh` (wired into ios/build.sh) must
#    cover the new probe/answer paths.
#
# 5. define-requirements keeps HIL (owner approves the feature story) at
#    risk_tier T1 rather than the project's T2: the feature adds dialogue
#    mechanics around the existing safety paths, not a new physical-safety
#    path. The owner-facing open decisions OD-M1..M4 (probe policy, option
#    source, phase sequencing, Phase-3 scope) are resolved here or carried
#    into design; the T2 human gate sits at final-sign-off
#    (profile-interview / spotify convention).
#
# PHASE STRUCTURE (per docs/multi-turn-conversation-feasibility.md §7 — the
# requirements/design phases must preserve it):
# - Phase 0 prerequisite: PR #156 voice-OOM hardening merged (437631e);
#   its Anzaan device smoke is still outstanding.
# - Phase 1 (deterministic MVP, shippable alone): frame mechanics + both
#   probe kinds (.slotFill + .candidateChoice/didYouMean) + curated on-device
#   catalog + deterministic merge; the owner's bhajan example must work
#   end-to-end with no training run.
# - Phase 2: follow-up NLU fine-tune v17 (follow-up training data +
#   prompt_template mirror); the frame clause ships ONLY with the training
#   iteration (prompt-identity drift hazard).
# - Phase 3: roll the frame over the stateless reminder/calendar missing-slot
#   re-prompts; DV-* device validation on Anzaan is the completion gate.
# ============================================================

version: "1"
name: multi-turn-conversation
description: "Multi-turn conversation: one-deep dialogue frames with template probes (slot-fill + did-you-mean candidate choice), free-text answer capture, deterministic merge, and the bhajan probe as the first end-to-end case"

defaults:
  risk_tier: T1
  max_rework_iterations: 5

tasks:
  define-requirements:
    use: define-requirements
    depends_on: []
    # HIL: the owner approves the feature story before design work starts.
    risk_tier: T1
    overlays:
      hil: { enabled: true }
    # Scope to record: one-deep dialogue frames (DialogueManager +
    # DialogueFrame) with two probe kinds — .slotFill (missing slot, e.g.
    # bhajan deity) and .candidateChoice/.didYouMean (honest not-understood
    # line + voice-pickable candidates by name/index/repetition/free-form,
    # "no — let me say it again" escape); pre-ladder answer interception with
    # cancel/emergency/barge-in rules; deterministic answer merge; curated
    # on-device option catalog; template probes (ne/en); max 2 probes then
    # execute with defaults; 45 s deadline. Open decisions OD-M1..M4 carry
    # into design. Explicit non-goals: open-ended chat, transcript history in
    # prompts, model-generated probe text, cloud anything, no changes to
    # emergency/medication behavior.

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]
    # Architect must resolve/design: DialogueFrame shape + probeKind enum;
    # the interception seam in CommandRouter.route (generalize the
    # confirmation hook ~785-886) and its ordering vs emergency keywords;
    # the awaitingSlotAnswer state + 45 s timer reuse; degenerate-query
    # detection in the music path (KeywordIntentRule.musicQuery); the curated
    # catalog format (localizable ne/en); how the frame survives the
    # degradation ladder (PR #156 pressure-tiered picks); Phase 2 frame-clause
    # budget within the pinned prompt (1024-token ceiling) and the v17
    # training-mirror requirement. Address OD-M1..M4 with the brief's
    # recommendations.

  design-l2:
    use: design-component
    depends_on: [design-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]
    exit_conditions:
      - "review.decision == GO"

  security-design-review:
    use: security-design-review
    depends_on: [review-l2]
    # STRIDE required. Focus areas: emergency precedence mid-dialogue
    # (override before any frame merge); free-text answer injection surface;
    # frame-trap resistance (cancel/barge-in/45 s timeout recovery);
    # log sanitisation of probe/answer text (B2/T-050); no new egress;
    # degraded-brain deterministic path must not weaken safety gates.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  plan-tasks:
    use: plan-tasks
    depends_on: [security-design-review]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).
    overlays:
      # Project baseline: paired agentic review required on all implementation
      # output. challenger_agent must differ from the driver agent (dev).
      review: { mode: "paired", enabled: true, challenger_agent: reviewer }
      confidence: { enabled: true, threshold: 0.85 }
    max_rework_iterations: 5

  review-implementation:
    use: review-implementation
    depends_on: [implement]
    exit_conditions:
      - "review.decision == GO"

  security-test:
    use: security-test
    depends_on: [review-implementation]
    # Focus: emergency precedence verified mid-frame; probe/answer text never
    # reaches logs (check-release-log-safety.sh coverage of the new paths);
    # cancel/timeout/barge-in recovery; degraded-brain fallback honored; the
    # didYouMean candidate list cannot be induced to bypass the ladder.
    exit_conditions:
      - "review.decision == \"SECURITY-GO\""

  final-sign-off:
    use: final-sign-off
    depends_on: [security-test]
    # T2 gate: senior human sign-off before the feature is considered done.
    # DV-* device validation on Anzaan is part of the completion gate
    # (probe → answer → correct playback; timeout; barge-in; degraded-brain
    # mid-dialogue; sustained multi-turn without jetsam).
    # Release gate: `ios/tools/check-release-log-safety.sh` must exit 0 —
    # wired into ios/build.sh ahead of every test scope.
    risk_tier: T2
    overlays:
      hil: { enabled: true }
