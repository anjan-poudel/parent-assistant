assumptions:
  - id: A1
    statement: "The integration surfaces exist as named in the feature constitution (the source mandate); the cited anchors were verified against master 261aa862 at requirements time (2026-10-15) for the entry model, scheduler, detector, OCR/editor, notifier and calendar surfaces listed in the constitution's Integration Surfaces table. Line numbers are orientation, not contracts. No capability claim in this set goes beyond those verified statements or the read-only source documents (root requirements.md; requirements-dementia-supplement.md; docs/medication-scheduler-implementation-plan.md)."
  - id: A2
    statement: "Numeric thresholds are inherited, not invented: the 30-second firing envelope is root NFR-005; the 44pt/18pt/contrast figures are the root elder-fit standards and the feature house rule; the photo-evidence size-cap and retention figures belong to the FR-D04b discipline referenced by FR-MSR-013. No new numeric target was fabricated."
  - id: A3
    statement: "Design-level choices are deliberately left open and are NOT requirements: OD-4 (scan confirm-step and partial-fill details), OD-5 (legacy rendering and any backfill), OD-6 (ack-with-slot resolution mechanics and interaction order), OD-7 (calendar-channel mechanism), OD-8 (photo-evidence mechanism and recipient). Each is bounded by the requirement(s) named in open_decisions and belongs to design-l1/design-l2."
  - id: A4
    statement: "The PhotoVerifier unwired state and the stub push transport are treated as verified facts; the set encodes honesty obligations around them (FR-MSR-013/016/018) rather than assuming delivery."
  - id: A5
    statement: "The project's known pre-existing full-bundle test failures remain the recorded baseline; the feature's own and touched suites are the honest gate (NFR-MSR-008/009)."
  - id: A6
    statement: "HIL: gate bedf72fc approved from Slack by owner U0C6DTHDMV0 on 2026-10-14T22:22:30Z; the T2 human gate sits at final-sign-off. Any sign-off change requires a re-lock."

constraints:
  - id: C1
    statement: "Preserved invariants (a change here is a non-goal): the reminder and escalation semantics of root FR-026-FR-028, the LLM independence of the medication scheduler unit, persistence-before-alarm, process-kill re-arm (root FR-029), the refusal-first denial guard, and the FR-D01/FR-D02/FR-D03 sequence order. No weakening is permitted."
    source: "feature constitution Out of scope and Safety & Compliance Delta; project constitution; requirements.md FR-026-FR-029"
  - id: C2
    statement: "The dementia machinery (confirmation challenge, double-dose detection, photo-verification components) is integrated and extended, never rebuilt or removed; decisions touching the FR-D01/FR-D03/FR-D04a-b machinery run under the elevated 0.90 confidence threshold."
    source: "feature constitution Out of scope; requirements-dementia-supplement.md 4.4"
  - id: C3
    statement: "OCR values are candidates only: nothing writes a schedule store on scan; the family's explicit review-and-save is the bind; every scan entry point routes through the same confirmation gate (safety delta (a))."
    source: "feature constitution Safety & Compliance Delta (a); Intake/Scan contracts"
  - id: C4
    statement: "The slot-to-clock mapping is deterministic and total; no reminder is armed without a determinate hour/minute; one resolved scheduled time drives the acknowledgement deadline, re-fire schedule, escalation deadline and missed-dose verdict (safety delta (b))."
    source: "feature constitution Entry Model & Slot-to-Clock Mapping contract; Open Decision 1 (resolved)"
  - id: C5
    statement: "Photo evidence augments and never replaces the acknowledgement plus confirmation chain; a photo never creates a record; recording happens only through the acknowledgement path (safety delta (c))."
    source: "feature constitution Safety & Compliance Delta (c); Photo-as-Evidence contract"
  - id: C6
    statement: "The caregiver wire stays PII-free: the versioned envelope carries alert type and timestamp, with the hashed entry identifier where correlation is needed; no names, doses or household content; the title-on-wire question stays an explicit owner-level decision, never smuggled in (safety delta (d))."
    source: "feature constitution Safety & Compliance Delta (d); Open Decision 3 (resolved)"
  - id: C7
    statement: "Label scanning and medication-photo processing stay on-device; no new cloud egress for medication content; the recorded cloud exceptions (voice transcription; OCR'd-text translation) do not apply to this feature."
    source: "feature constitution Feature Constraints (no new cloud egress); project constitution"
  - id: C8
    statement: "Honest degradation: no silent stubs; the unwired photo-verification machinery is surfaced as itself; an undelivered notification is never presented as success; a failed persistence write surfaces and blocks its dependent step."
    source: "docs/medication-scheduler-implementation-plan.md safety invariants 4-5; feature constitution Feature Constraint 9; project constitution Agent Principles"
  - id: C9
    statement: "Correction and disambiguation copy follows the owner rule: \"did you mean X / X or Y\" ONLY — no leading questions, no numbered lists, ever."
    source: "owner rule (correction copy); feature constitution voice-ack contract; FR-MSR-008"
  - id: C10
    statement: "Voice pipeline discipline: the refusal-first denial guard is preserved everywhere; acknowledgements play through the ack fast lane so the microphone never closes and listening resumes with no gap."
    source: "feature constitution Integration Surfaces (CommandRouter, AckFastLane [ACK-MIC-CONTINUITY]); FR-MSR-011/012"
  - id: C11
    statement: "Elderly-fit measures: 44pt minimum targets, 18pt body text with system scaling, WCAG AA contrast, voice-first completion; all new strings exist in Nepali and English; all spoken times go through the mandated spoken-time formatter; the Devanagari substring/grapheme-cluster behaviour is regression-pinned and not 'fixed'."
    source: "root NFR-020-NFR-022; project house rules; feature constitution Feature Constraints 7-8"
  - id: C12
    statement: "Release gate: ios/tools/check-release-log-safety.sh must exit 0 covering the feature's new paths; the scoped medication and notifier suites are the honest gate, with the pre-existing full-bundle baseline recorded rather than silently included or excluded."
    source: "project constitution Release gates; feature constitution Success Criteria and Test Rigor"
  - id: C13
    statement: "Delivery (house rule, inherited): work ONLY in the sibling worktree elderly-ai-assistant-medication-schedules-reminders (branch feat/medication-schedules-reminders); integrate via PR against master; never the main checkout."
    source: "project CLAUDE.md working rules; feature workflow"

open_decisions:  # no owner-level decision open; OD-1..OD-3 are RESOLVED in the feature constitution (2026-10-15) and carried as requirements (FR-MSR-002, FR-MSR-003, FR-MSR-015/016/017); OD-4..OD-8 are design-level and belong to design-l1/design-l2
  - id: OD-4
    statement: "Scan-to-fill: extraction surface, confirm step, partial-fill behaviour. Confirm nothing auto-binds, strength→doseDescription stays, the parser's conservative partial-fill rules remain binding, and purpose stays manual/lookup. Bounded by FR-MSR-005 (additive, non-destructive, refuses to guess) and FR-MSR-006 (human confirmation before binding is fixed). Owner of the decision: design-l1/design-l2."
  - id: OD-5
    statement: "Legacy entries in the new model: how pre-revamp entries (raw scheduleTimes, e.g. 08:00 / 20:00, no slot/meal fields) render in the slot-based UI; whether any backfill (times→slot inference) is allowed at migration; whether .weekly/.custom frequency entries are representable. Recorded safe default to confirm: legacy scheduleTimes readable and representable, entries keep working exactly as today until the family edits them, no automatic slot inference. Bounded by NFR-MSR-006. Owner: design-l1/design-l2."
  - id: OD-6
    statement: "Voice ack with slot: resolution and interaction order — how the named-slot utterance resolves when multiple reminders are pending, that the FR-D01 challenge and FR-D03 double-dose sequence keeps its exact order for the new shapes, and the honest behaviour when the named medication does not match or is ambiguous (sanctioned clarification, never a guess; no path records without the challenge). Bounded by FR-MSR-007/008/009/011. Owner: design-l1/design-l2."
  - id: OD-7
    statement: "Caregiver calendar-events channel: (a) the existing consent-gated schedule mirror with caregivers following that calendar, (b) significant events written as calendar entries, or (c) another shape — and which events surface there. Bounded by FR-MSR-016 (consent gate, honest results) and FR-MSR-017 (no new PII on any channel). Owner: design-l1/design-l2."
  - id: OD-8
    statement: "Photo-as-evidence: mechanism and recipient — reuse the existing (unwired) PhotoVerifier E2E path once wired, an on-device-only variant, or an extension of the per-medication/per-time-of-day dementia mechanism; what the photo proves (identifying the medication at a shared slot vs the existing FR-D04a empty-hand presence check) and who judges it. Bounded by FR-MSR-013 (augments never replaces; never assumes the unwired machinery works; on-device; delivery discipline if it leaves the device), FR-MSR-014 (deterministic, conservative resolution) and FR-MSR-020 (removal of the dementia mechanism forbidden). Owner: design-l1/design-l2."

