assumptions:
  - id: A1
    statement: "The integration surfaces exist as named in the feature constitution and the scaffold report; the cited anchors were verified as present in the worktree at requirements time (base master 91deddca) — IntentPrompt.buildChat (:197-211); LlamaCommandInterpreter OnDeviceSampling (:404-417), handle creation (:1391-1398), chatSystemPrompt (:552-563), chatJSONSchema (:350), respondToChat (:709); GeminiCommandInterpreter.replyPersona (:35-44); GeminiClient.GenerationConfig (:659-661); SpokenReplyPolisher doctrine (:21-26); LocalBrainChain.respondToChat (:268-294); IntentRouter.interpretLocalLadder (:259-291) / runLocalLadder (:308-395); AppCoordinator.defaultBrainModelID; ModelCatalog.qwen4BNepali (:237); tools/train-intent/seeds/ (prompt_template.txt, command_schema.json, intents.yaml present); tools/train-intent/eval/ (golden_corpus.jsonl, emergency_nearmiss.jsonl present); ios/tools/check-release-log-safety.sh present and executable. Line numbers are orientation, not contracts."
  - id: A2
    statement: "Design-level choices are deliberately left open and are NOT requirements: the chat temperature value and its sampling plumbing, incl. GBNF interplay (OD-1); the style-spec artifact format and how its four consumers resolve against it (OD-2); the particles-budget enforcement mechanics (OD-4); the Gemini chat temperature value (OD-5); the ModelCatalog entry naming/versioning scheme and the per-device resolver's tier criteria (FR-CNR-022/028); the grammar guard's internal check implementation and per-class thresholds (FR-CNR-005); the consent/indicator/revocation UX shapes (FR-CNR-009, bounded by NFR-CNR-009); the safe-template wording (FR-CNR-006, bounded by NFR-CNR-010)."
  - id: A3
    statement: "The 5-8 s/turn chat latency band in NFR-CNR-002 is the proposal's measured figure for the Qwen3-1.7B device default, recorded as the reference-tier target band; it is not invented. The existing suite gate (latency p50 <=1.0 s) remains a separate non-negotiable regression and is not merged into this band."
  - id: A4
    statement: "The memory/jetsam requirement (NFR-CNR-003) is expressed as counted properties - exactly one resident brain model, zero feature-attributable jetsam terminations across the DV session, no additional KV/context allocation beyond the pinned budget - because the source documents state no byte-level memory threshold. No numeric threshold was invented."
  - id: A5
    statement: "Exact user-facing copy (cloud-chat consent and disclosure, indicator labels, safe-template replies, degradation notices) is design-dependent and localisation-bound; the ne/en keys must exist per NFR-CNR-010, and the copy is reviewed under the Open Decision 12/13 review clause before the first App Store submission."
  - id: A6
    statement: "Sub-artifacts named in the sources (the enterprise licence for the Nepali call-center corpus; the optional NepaliGPT CPT phase; the server-side Nepali GEC corrector as corpus-cleaning tooling) are encoded as binding properties and conditions, not as their internal designs."
  - id: A7
    statement: "The project's known pre-existing full-bundle test failures remain the baseline for NFR-CNR-011; the feature's own and touched suites must pass, with baseline failures recorded rather than silently included or excluded."

constraints:
  - id: C1
    statement: "Non-goal: the single-decode schema is unchanged - one JSON (intent + reply + confidence), no chain/router surgery; the v17 variant is a ModelCatalog swap, versioned and reversible."
    source: "feature constitution Out of scope; Runtime Contract 'Chat decode' 3; Model & Training Contract 1-2"
  - id: C2
    statement: "Non-goal: the router ladder and emergency gate behaviour are unchanged; emergency recall 1.00 is a gate, not a metric. Chat routing never alters ladder ordering, triggers or the emergency path."
    source: "feature constitution Out of scope; Cloud-first chat routing toggle 1; Safety & Compliance Delta 1"
  - id: C3
    statement: "Non-goal: STT behaviour is untouched - the STT-engine invariant (owner-declared: functioning STT is the invariant of any change) stands; a transcript regression is a stop-and-investigate event."
    source: "feature constitution Out of scope; Safety & Compliance Delta 6"
  - id: C4
    statement: "Non-goal: command-turn decode determinism - temp-0 + fixed seed (20_260_907) + GBNF commandJSONSchema stay byte-for-byte untouched; only chat turns use the fixed-seed chat sampling setting."
    source: "feature constitution Runtime Contract 'Chat decode' 1; proposal 5.1/7"
  - id: C5
    statement: "Non-goal: no new device permission and no new data collection beyond the recorded cloud-chat egress and classification-only telemetry; only the consent-gated cloud chat path carries conversation content off the device."
    source: "feature constitution Out of scope; Cloud-first chat routing toggle 3; project constitution OD-12/13 pattern"
  - id: C6
    statement: "Non-goal: no few-shot exemplars in the on-device prompt - style travels via data, not prompt tokens; combined with the pinned 1,024-token budget."
    source: "proposal 4; feature constitution Prompt/seed discipline 3"
  - id: C7
    statement: "Prompt discipline: seeds/chat_prompt_template.txt byte-mirrors IntentPrompt.buildChat and the mirror lands in the SAME change; the intent prompt bytes and seeds/prompt_template.txt stay byte-identical to their pre-change content."
    source: "proposal 4; feature constitution Prompt/seed discipline 1-2"
  - id: C8
    statement: "Cloud chat is a recorded OD-12-shape exception to Architecture Constraint 1: explicit consent at first cloud use, plain-language disclosure, visible indicator while content goes to the cloud, revocable at any time, on-device fallback that never blocks chat, provider key in a header only and never in URLs or logs (B2/T-050 precedent). The feature-level exception is recorded so the root constitution's recorded-exceptions list can be amended at final sign-off."
    source: "feature constitution Cloud-first chat routing toggle 2-6; Safety & Compliance Delta 2; project constitution OD-12/OD-13"
  - id: C9
    statement: "Ship-mix licence hygiene: the SHIPPED training mix is CC-BY/Apache/MIT + synthetic + own data only; CC BY-NC sources (IndicDialogue, DailyDialog, PersonaChat, EmpatheticDialogues) and research-gated / unlicensed sources (Nepali call-center corpus) are dev-mix only. A provenance manifest is the evidence; contamination of a shipped artifact is a compliance event."
    source: "proposal 3/7; feature constitution Data provenance 1-4"
  - id: C10
    statement: "Gate discipline: the catalog swap ships only with ALL gates green (new chat gates plus every existing regression gate); a red gate is a stop, not a threshold to move. Harness output is release evidence."
    source: "proposal 6; feature constitution Mixture and gate harness 2-3"
  - id: C11
    statement: "Delivery - house rule (inherited): work ONLY in the sibling worktree /Users/anjan/workspace/projects/elderly-ai-assistant-conversational-nepali-replies (branch feat/conversational-nepali-replies); integrate via PR against master; never the main checkout."
    source: "project CLAUDE.md working rules; feature workflow"
  - id: C12
    statement: "Release gate: ios/tools/check-release-log-safety.sh must exit 0 (build-blocking, wired into ios/build.sh ahead of every test scope) with the new chat/routing/guard source paths inside its coverage; the pre-release device console/sysdiagnose check covers the same paths."
    source: "project constitution Release gates; feature constitution Cloud-first chat routing toggle 4 and Success Criteria"
  - id: C13
    statement: "Feasibility honesty: if any leg is infeasible or only partially feasible (chat sampling reproducibility on a tier and GBNF interplay, guard coverage, cloud consent/indicator behaviour, training thresholds, 4B tier admission, P0->P1->P2 sequencing), it is stated explicitly for the owner - no silent drop."
    source: "feature constitution Runtime Contract 'Chat decode' 4 / OD-1 / workflow design-l1 comment; project constitution Agent Principles (no silent stubs)"

open_decisions:  # no owner-level decision open; OD-1..OD-5 are design-level and belong to design-l1/design-l2
  - id: OD-1
    statement: "Chat temperature value + sampling plumbing (per-turn override vs. a shape-specific handle; the LLM handle is created once) and the GBNF interplay. Bounded by FR-CNR-003/004 and NFR-CNR-001; feasibility honesty via FR-CNR-024. Owner of the decision: design-l1."
  - id: OD-2
    statement: "Style-spec artifact format (prose vs. machine-readable) and how the four consumers resolve against one file without duplication, incl. which parts the guard/eval execute directly. Bounded by FR-CNR-001 (single source, no forks) and NFR-CNR-005. Owner: design-l1."
  - id: OD-3
    statement: "Owner question (recorded, not resolved by this task): P0 landing path - full P0->P1->P2 in this run (owner directive) vs. P0 as a normal PR first, which the approved proposal explicitly permits. Sequencing only; scope and contracts identical. A deviation is reported per FR-CNR-024."
  - id: OD-4
    statement: "Particles-budget enforcement mechanics (which particle set counts; guard check vs. eval rubric vs. both; interaction with the <=2-sentence ceiling and code-switched sentences). Bounded by FR-CNR-001 (the <=1 per-reply budget is fixed), FR-CNR-005 and FR-CNR-020. Owner: design-l1."
  - id: OD-5
    statement: "The Gemini chat temperature value (the on-device side is ~0.3); the cloud value is proposed with a rationale and reviewed at design review. Bounded by FR-CNR-011 (explicit, reviewed) and FR-CNR-002 (no local/cloud drift). Owner: design-l1."

out_of_scope:
  - "The single-decode schema - one JSON (intent + response/reply + confidence); no chain/router surgery; v17 is a catalog swap (FR-CNR-013, FR-CNR-022)"
  - "Router ladder and emergency gate behaviour; chat pre-check semantics beyond wiring the routing toggle (FR-CNR-014)"
  - "STT behaviour - the speech pipeline is not part of this feature (FR-CNR-015)"
  - "Command-turn decode determinism - temp-0 + fixed seed + GBNF commandJSONSchema (FR-CNR-004)"
  - "Any new device permission; any new data collection beyond the recorded cloud-chat egress and classification-only telemetry (FR-CNR-010, FR-CNR-015, NFR-CNR-007)"
  - "Few-shot exemplars in the on-device prompt (FR-CNR-023, NFR-CNR-004)"
  - "The intent prompt bytes - IntentPrompt.build, seeds/prompt_template.txt and the IntentPromptTests pin (FR-CNR-023)"
  - "Emergency-call logic, medication flow, health monitoring and the encrypted remote-config channel"
  - "Non-chat content on the cloud chat path - commands and emergency phrasing do not travel the new toggle (FR-CNR-010)"
  - "CC BY-NC and research-gated data in shipped artifacts (FR-CNR-018)"
  - "A new training pipeline - v17 extends tools/train-intent (FR-CNR-016)"
  - "An on-device Nepali GEC corrector (~3.5 GB quantized; out of scope for the current device tiers) - the guard verifies instead of correcting (FR-CNR-005)"
  - "Automatic transliteration / script bridging in matching or dialling surfaces elsewhere in the app - not re-opened by this feature (FR-CNR-027 keeps replies scoped)"
  - "Android - no platform scope beyond the existing iOS app"

security_surfaces:
  - surface: "Shared safety-critical model - the v17 chat variant is the SAME single-decode model that answers commands and the emergency path; the 30% claw-back mixture is the mitigation and the catalog swap is versioned, reversible and gated"
    requirements: ["FR-CNR-014", "FR-CNR-016", "FR-CNR-021", "FR-CNR-022", "NFR-CNR-008"]
  - surface: "NEW cloud egress - chat conversation content reaches Gemini via the cloud-first routing toggle and the grammar-guard escalation, beyond the recorded exceptions (OD-12 voice transcription only; OD-13 OCR'd text only); consent/disclosure/indicator/revocation in the OD-12 shape; local fallback that never blocks chat"
    requirements: ["FR-CNR-006", "FR-CNR-008", "FR-CNR-009", "FR-CNR-010"]
  - surface: "Credential + content hygiene - provider key in a header only, never URLs or logs; conversation content off the logs beyond the existing transcript policy; check-release-log-safety.sh coverage of the new paths"
    requirements: ["FR-CNR-012", "NFR-CNR-006", "FR-CNR-007", "NFR-CNR-007"]
  - surface: "Guard integrity - verify-never-rewrite; escalation or safe template on a flag; honest degradation on guard failure; a guard-invented rewrite is forbidden"
    requirements: ["FR-CNR-005", "FR-CNR-006", "FR-CNR-007"]
  - surface: "Data provenance and licence compliance - ship mix CC-BY/Apache/MIT + synthetic + own data only; no CC BY-NC contamination of a shipped artifact; the manifest is the evidence"
    requirements: ["FR-CNR-017", "FR-CNR-018", "FR-CNR-029"]
  - surface: "Prompt discipline - 1,024-token budget held; seeds/chat_prompt_template.txt byte-mirrors IntentPrompt.buildChat in the same change; the intent prompt stays byte-identical; no few-shot exemplars"
    requirements: ["FR-CNR-023", "NFR-CNR-004", "NFR-CNR-005"]
  - surface: "Determinism and resource behaviour on device tiers - fixed-seed chat reproducibility; the NO-GIBBERISH command invariants untouched; one resident brain model; zero feature-attributable jetsam terminations; the latency envelope"
    requirements: ["FR-CNR-003", "FR-CNR-004", "NFR-CNR-001", "NFR-CNR-002", "NFR-CNR-003"]
  - surface: "Unchanged surfaces - STT pipeline, device permissions, data collection, the single-decode schema, the intent prompt bytes"
    requirements: ["FR-CNR-013", "FR-CNR-014", "FR-CNR-015"]

traceability:
  - gate: "design-l1"
    checks: "Resolve OD-1..OD-5 inside this set's contracts: the style-spec artifact and its four consumer seams (FR-CNR-001/002/005/017/020); the chat decode seam with reproducibility tests (FR-CNR-003, NFR-CNR-001) without moving the command invariants (FR-CNR-004); the grammar-guard contract - checks incl. timi/tapai-verb agreement, Devanagari purity, dangling particles; verify-never-rewrite; escalation; content-free telemetry (FR-CNR-005..007); the cloud toggle shape - consent state, disclosure copy seam, visible indicator, offline fallback, the OD-12-shape amendment (FR-CNR-008..010/012); the Gemini chat temperature seam (FR-CNR-011); the v17 suite extension - data layers, mixture, filters, provenance manifest, gate-harness extension, catalog entry + rollback path (FR-CNR-016..022); the DV protocol on Anzaan (FR-CNR-025). Feasibility honesty starts here (FR-CNR-024)."
  - gate: "design-l2"
    checks: "Component design against this set: interface contracts for the style spec and its consumers, the chat sampling seam, the guard verdict/flag surface, the consent/indicator state, the cloud chat request, the training-suite variant and the catalog entry; sequencing P0 -> P1 -> P2 (FR-CNR-024 records deviation)."
  - gate: "review-l2"
    checks: "review.decision == GO against the component design and this set."
  - gate: "security-design-review"
    checks: "STRIDE with the new cloud egress and the shared safety-critical model as named focus areas: safety-gate regression + catalog-swap discipline (FR-CNR-014/021/022, NFR-CNR-008); cloud chat consent/disclosure in the OD-12 shape (FR-CNR-008/009/010); credential + content hygiene incl. the flag event carrying no user content (FR-CNR-007/012, NFR-CNR-006/007); guard integrity (FR-CNR-005/006); data provenance (FR-CNR-017/018); prompt discipline (FR-CNR-023, NFR-CNR-004/005). SECURITY-GO required."
  - gate: "plan-tasks / implement"
    checks: "Units trace back to FR-CNR-* / NFR-CNR-* ids; P0 lands before P1 per the owner directive (FR-CNR-024 records any deviation); paired review and the 0.85 confidence threshold on implementation output; focused tests + typecheck per unit."
  - gate: "review-implementation"
    checks: "review.decision == GO over the implementation against this set."
  - gate: "security-test"
    checks: "Evidence: emergency recall stays 1.00 and command decode stays deterministic after the chat changes (FR-CNR-004/014/021); chat turns are reproducible at the fixed-seed chat setting (NFR-CNR-001, FR-CNR-003); the grammar guard never rewrites and its escalation/fallback degrades honestly (FR-CNR-005/006); the cloud chat path enforces consent + visible indicator and never leaks the provider key or conversation content into logs, with check-release-log-safety.sh coverage of the new paths (FR-CNR-009/012, NFR-CNR-006/007); the ship-mix provenance manifest proves no CC BY-NC source (FR-CNR-018); the chat templates stay within the pinned 1,024-token budget and the seed mirror is byte-identical (FR-CNR-023, NFR-CNR-004/005). SECURITY-GO required."
  - gate: "final-sign-off"
    checks: "T2 + HIL; the DV-1..DV-6 checklist is recorded and passed on Anzaan (FR-CNR-025); ios/tools/check-release-log-safety.sh exits 0 (FR-CNR-012, NFR-CNR-006/011); the feasibility-honesty statement for every leg is explicit for the owner (FR-CNR-024)."
