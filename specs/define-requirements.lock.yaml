out_of_scope:
  - "call-dialer-primary-secondary — explicitly distinct, in flight; no absorption, redesign or scope merge; implementation queues behind its merge (NFR-FCU-008)"
  - "Bulk address-book sync/import, and editing any system-contact field other than the photo (no name/number writes, no bulk rewrites) — FR-FCU-008, C5"
  - "Automatic transliteration / romanization — \"sanu\" and \"सानु\" are distinct spellings unless both are stored (OD-2 resolved; FR-FCU-011/012/013)"
  - "Redesigning the call-resolution chain — ContactResolver/MethodResolver structure beyond the named nickname seam is unchanged"
  - "Any new network surface; any new data collection; anything leaving the device — NFR-FCU-003"
  - "The Devanagari substring/grapheme-cluster behavior — regression-pinned; must not be \"fixed\" (NFR-FCU-007, C3)"
  - "Emergency-contact semantics — unchanged by this feature"
  - "Per-contact ownership across devices, and non-family book-row photo display — book rows keep today's initials avatar (A3)"
  - "Android — no platform scope beyond the existing iOS app"

security_surfaces:
  - surface: "Write authority — the app's first write into the shared system address book; blast radius confined to the edited contact's photo; no bulk mutation; wrong-target write prevented by construction; no other field ever modified"
    requirements: ["FR-FCU-008", "FR-FCU-009", "NFR-FCU-002", "NFR-FCU-009"]
  - surface: "Identity integrity — a wrong link merges two people; a nickname matching several contacts must never silently dial the wrong person; unlink as the safety valve; stale/mismatched link degradation without false merge"
    requirements: ["FR-FCU-003", "FR-FCU-005", "FR-FCU-006", "FR-FCU-014"]
  - surface: "Degradation safety — permission denied/limited/read-only or a failed save falls back to the app-local photo with honest UI; no data loss, no false success, no crash, no authorization reasoning asked of the elderly user"
    requirements: ["FR-FCU-007", "FR-FCU-009", "FR-FCU-010", "NFR-FCU-005"]
  - surface: "PII / log discipline — names, nicknames, numbers, link identifiers and photo data must not reach logs beyond B2/T-050; check-release-log-safety.sh coverage of the new write/fallback/resolution paths"
    requirements: ["NFR-FCU-002", "FR-FCU-006"]
  - surface: "No new egress — contacts, links, nicknames and photos stay on-device; no new network surface, no new data collection, no new permission keys"
    requirements: ["NFR-FCU-003"]
  - surface: "Matching-semantics integrity — reuse not fork; grapheme behavior regression-pinned (no \"fixes\"); no transliteration bridging; deterministic ambiguity handling"
    requirements: ["FR-FCU-012", "FR-FCU-013", "NFR-FCU-007"]
  - surface: "Migration integrity — legacy payloads (pre-nickname, single nickname, pre-link) load with zero loss; the pre-change single nickname still matches (DV-6)"
    requirements: ["FR-FCU-002", "FR-FCU-011", "NFR-FCU-006"]

traceability:
  - gate: "design-l1"
    checks: "Resolve the design-level choices this set deliberately leaves open, bound by the requirements' invariants: link storage shape + identifier strategy (FR-FCU-002/006); write-seam file/name + injection shape (FR-FCU-008); nickname index structure (NFR-FCU-001); unlink mechanics/UI (FR-FCU-005); linked-row representation (FR-FCU-003); exact tier placement of nickname hits in FamilyMatchTier (FR-FCU-012). OD-1 (straight to design-l1) and OD-2 (store-as-entered) are settled inputs — do not re-open. The three-ask feasibility statement starts here (FR-FCU-016)."
  - gate: "design-l2"
    checks: "Component design against this set; interface contracts for the link reference, the CNSaveRequest seam, the nickname structure + index, the editor UI and the permission handling; sequencing vs call-dialer (NFR-FCU-008)."
  - gate: "review-l2"
    checks: "review.decision == GO against the component design and this set."
  - gate: "security-design-review"
    checks: "STRIDE with the new write surface and identity/link semantics as named focus areas: write authority blast radius confined to the edited contact's photo (FR-FCU-008/009, C5); identity integrity — wrong link, ambiguous nickname never silently dialing the wrong person (FR-FCU-003/005/006/014); degradation safety — denied/limited/read-only/failed-save fallback with honest UI (FR-FCU-010, NFR-FCU-005); PII off the logs beyond B2/T-050 (NFR-FCU-002); no new egress (NFR-FCU-003); matching-semantics integrity (NFR-FCU-007); SECURITY-GO required."
  - gate: "plan-tasks / implement"
    checks: "Units trace back to FR-FCU-* / NFR-FCU-* ids; implementation queues behind call-dialer-primary-secondary's merge and resolves the conflicting surfaces as a union preserving its behavior (NFR-FCU-008, C1); paired review and the 0.85 confidence threshold on implementation output; focused tests + typecheck per unit (NFR-FCU-009, C10)."
  - gate: "security-test"
    checks: "Evidence: photo write confined to the edited contact's photo and a failed save is a no-op (FR-FCU-008); authorization states detected not assumed, no false success (FR-FCU-009); fallback keeps the app-local photo with no loss (FR-FCU-010); names/nicknames/numbers/links/photos never reach logs and check-release-log-safety.sh covers the new paths (NFR-FCU-002); grapheme pin holds (NFR-FCU-007); migration fixtures load with zero loss (NFR-FCU-006); SECURITY-GO required."
  - gate: "final-sign-off"
    checks: "T2 + HIL; spec/plan reflect the final state; ios/tools/check-release-log-safety.sh exits 0 (NFR-FCU-002/009); the DV-1..DV-6 checklist is recorded and passed on the reference device (FR-FCU-017); the three-ask feasibility statement is explicit for the owner (FR-FCU-016)."
