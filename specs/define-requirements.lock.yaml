  - "No removal of the existing dementia machinery — challenge, double-dose detection, photo-verification components are integrated and extended only (FR-MSR-020)"
  - "No new cloud egress for medication content — label/photo processing stays on-device (NFR-MSR-003)"
  - "No new PII on the caregiver wire — the title/name-on-wire question stays an explicit owner-level decision (FR-MSR-017)"
  - "The end-to-end push transport (inherited tracked work, docs/family-notifier-e2e-implementation-plan.md) — the feature's scope is the trigger paths, the calendar channel and honest reporting (FR-MSR-016)"
  - "Devanagari substring/grapheme-cluster behaviour — regression-pinned; not 'fixed' (NFR-MSR-007)"
  - "Partial-vs-full dose detection — out of scope; the double-dose detector's semantics are unchanged (FR-MSR-003)"

security_surfaces:
  - surface: "Scan-to-fill writes into a safety-critical schedule — OCR values require human confirmation before binding; an OCR misread must cost a correction, never a dose"
    requirements: ["FR-MSR-005", "FR-MSR-006"]
  - surface: "Slot-to-clock mapping feeding the escalation engine — deterministic and total; no armed reminder without a determinate time; one resolved scheduled time drives every derived instant"
    requirements: ["FR-MSR-002", "FR-MSR-019", "NFR-MSR-010"]
  - surface: "Photo-as-evidence — augments never replaces; a photo never creates a record; on-device processing; the unwired machinery surfaced honestly"
    requirements: ["FR-MSR-013", "FR-MSR-014", "FR-MSR-018", "NFR-MSR-003"]
  - surface: "Caregiver wire — PII-free taxonomy; hashed entry identifier only; no names, doses or household content; title-on-wire stays owner-level"
    requirements: ["FR-MSR-015", "FR-MSR-016", "FR-MSR-017"]
  - surface: "Persistence and process-kill — persistence before alarm; acknowledgement durable immediately on confirmation; re-arm within the unexpired window"
    requirements: ["FR-MSR-022", "NFR-MSR-008"]
  - surface: "Dementia safety machinery — challenge, double-dose detector and photo components preserved; refusal-first denial guard; no bypass of the acknowledgement sequence; elevated 0.90 on touched machinery"
    requirements: ["FR-MSR-009", "FR-MSR-011", "FR-MSR-020", "NFR-MSR-008"]
  - surface: "Voice pipeline integrity — mic continuity around acknowledgements; conservative disambiguation never records the wrong medication; sanctioned clarification copy only"
    requirements: ["FR-MSR-007", "FR-MSR-008", "FR-MSR-012"]
  - surface: "Observability — hash-only medication identifiers; sanitiser applied; release log gate covering the new paths"
    requirements: ["NFR-MSR-002", "NFR-MSR-009"]

