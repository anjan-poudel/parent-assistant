assumptions:
  - id: A1
    statement: "The integration surfaces exist as named in the feature constitution's surface table: the YouTube pattern files (YouTubePlugin/YouTubeTool/YouTubeRoute and their test suites), the CommandRouter tool seams (the configStore/transport/linkOpener pattern around lines 639-648), AppCoordinator plugin registration and store wiring (around line 2058), SettingsView/SettingsTabs, and the Localizable.xcstrings + Info.plist surfaces. The scaffold probe (specs/spotify-music-integration/init-report.md) records the scaffold step only, not a code probe."
    source: "feature constitution Integration Surfaces; specs/spotify-music-integration/init-report.md"
  - id: A2
    statement: "The stub line being replaced is the router.musicStub string ('Music isn't ready yet. Coming soon.' / 'संगीत सुविधा अहिले तयार छैन। चाँडै आउनेछ।'), spoken from the case .music: branch; the key may remain in the string catalog but must not be spoken on a music path once the feature ships."
    source: "feature constitution Purpose & Scope; CommandRouter case .music:"
  - id: A3
    statement: "The golden-corpus music block currently holds 15 utterances pinned to intent music (ios/ElderlyAssistantTests/ Services/Voice/GoldenCorpus.swift lines 142-157), while the feature constitution says 16 utterances; implementation reconciles the count against the source and records the result."
    source: "feature constitution Feature Constraint 5; source inspection at requirements time"
  - id: A4
    statement: "The spotify: deep-link fallback presumes the Spotify app is installed for that path (the device expectation); where it is absent, the honest-messaging rule applies instead of any fallback claim."
    source: "feature constitution Feature Constraint 8"
  - id: A5
    statement: "The caregiver/family member performs linking and credential setup at the device; the elderly primary user never handles OAuth or keys, and this feature adds no remote companion-app flow for Spotify linking."
    source: "feature constitution Purpose & Scope (primary/secondary user); established family-handles-credentials pattern"
  - id: A6
    statement: "Provider identifiers used in requirement examples are synthetic placeholders; no real track ID, client ID, secret, token or other credential is recorded anywhere in this requirement set."
    source: "this requirements pass (SEC-002 discipline)"
  - id: A7
    statement: "Exact user-facing copy for the degradation paths is OD-S3; the Nepali/English example lines in this set are illustrative, and the requirement binds that the keys exist and are localized in both languages."
    source: "feature constitution OD-S3; Feature Constraint 12"
  - id: A8
    statement: "The project unit-test baseline includes known pre-existing failures unrelated to this feature; NFR-SP-006 binds the feature's suites and the touched suites, with baseline failures recorded rather than silently included or excluded."
    source: "project test baseline; feature constitution Feature Constraint 5"
  - id: A9
    statement: "The project build gate is ios/build.sh, and the release-build log-surface gate ios/tools/check-release-log-safety.sh is wired into it; both are binding for this feature."
    source: "project constitution Release gates; feature constitution Feature Constraint 2"

constraints:
  - id: C1
    statement: "Architecture Constraint 1 (amended 2026-10-06) permits Spotify as a network integration for search and user-initiated playback hand-off; the on-device AI stance is unchanged and no other network egress is added or widened."
    source: "project constitution Architecture Constraint 1 + amendment; feature constitution amendment record"
  - id: C2
    statement: "No Spotify code without the constitutional amendment: the 2026-10-06 amendment (Constraint 1 + Required-integrations list) is part of the feature change set."
    source: "feature constitution Feature Constraint 10"
  - id: C3
    statement: "Credential discipline: scopes requested at sign-in (addScopes), tokens verified, encrypted on-device storage (Keychain / EncryptedLocalStorage, Data Protection Complete), no credentials in the repository or any log; keys travel in a header, never a URL; the check-release-log-safety.sh gate is binding."
    source: "feature constitution Feature Constraint 2 + amendment; project constitution Standards/release gates"
  - id: C4
    statement: "Prompt budget: IntentPromptTests pins the intent prompt's token budget; music/Spotify wording must fit it and must not raise the pin; the deterministic keyword rule is the zero-prompt-token model."
    source: "feature constitution Feature Constraint 3"
  - id: C5
    statement: "Must-not-break paths: explicit YouTube requests ('युट्युबमा गीत चलाऊ') still route to YouTube exactly as today; Spotify-unavailable/unlinked falls back to YouTube; golden-corpus and route expectations change only where deliberately superseded, with the new expectation recorded alongside."
    source: "feature constitution Feature Constraint 5"
  - id: C6
    statement: "No new backend: the Spotify Web API is called directly from the app; development-mode rollout is limited to registered test users until a quota-extension request is approved, and unregistered users still see honest behaviour."
    source: "feature constitution Feature Constraints 6-7"
  - id: C7
    statement: "Premium reality: playback control requires Spotify Premium; free-tier or unlinked remote control degrades to the spotify: deep-link fallback with clear messaging, never a silent failure."
    source: "feature constitution Feature Constraint 1; root Agent Principle (no silent stubs)"
  - id: C8
    statement: "Device expectation: the Spotify app is installed for the spotify: deep-link fallback; behaviour without it follows the honest-messaging rule."
    source: "feature constitution Feature Constraint 8"
  - id: C9
    statement: "Plugin isolation: the feature ships as an AssistantPlugin (SpotifyPlugin) with no entanglement beyond the mapped CommandRouter seams; no brain/router model-stack changes; no cloud LLM on the music path."
    source: "feature constitution Feature Constraint 11 and Feature Constraint 4"
  - id: C10
    statement: "Localization discipline: all Spotify user-facing strings are localized (ne/en) via spotify.* keys, mirroring the YouTube plugin's L10n pattern."
    source: "feature constitution Feature Constraint 12"

open_decisions:
  - id: OD-S1
    statement: "Client-secret handling for the Spotify search flow: family-entered credential per the YouTubeConfigStore/SearchConfigStore Keychain precedent versus PKCE-only options where the flow permits; must satisfy constraint 2 and interact cleanly with the dev-mode test-user limit. The requirements bind the storage/log discipline for whichever path resolves."
    resolves_at: "design-l1 (recorded in security-design-review as well)"
    owner: "architect / security review"
  - id: OD-S2
    statement: "Spotify development-mode rollout and quota-extension plan: which accounts are registered during development and device validation, when the quota-extension request is filed, what unregistered users experience before approval, and the console-side Developer Dashboard registration (client ID + secret, redirect URI, scopes). The requirements bind honest behaviour for unregistered users regardless."
    resolves_at: "owner + design-l1"
    owner: "owner / architect"
  - id: OD-S3
    statement: "Premium-account degradation path: exact UX and precedence when Spotify cannot perform playback (free tier, unlinked, network/service failure, empty search) - which cases degrade to the spotify: deep-link fallback, which fall back to YouTube, the exact localized copy, and how both-provider search behaves in each case. The requirements bind that each path is non-silent and honest; composition and copy stay open."
    resolves_at: "design-l1 / design-l2"
    owner: "architect"

out_of_scope:
  - "Cloud LLM on the music path (voice intent parsing and routing stay on-device; music queries go to the provider APIs directly)"
  - "Brain/router model-stack changes (no model, catalog, weights or routing-model changes beyond the pinned intent wording)"
  - "A new backend (the Spotify Web API is called directly from the app; nothing provisioned on our side)"
  - "Explicit-YouTube routing changes ('युट्युबमा गीत चलाऊ' still reaches YouTube exactly as today)"
  - "Library/playlist edits and account modifications (playback is read-only, user-initiated media control)"
  - "Emergency / medication / health surface changes (none of any kind; no new safety path added or altered)"
  - "Any network egress beyond the two provider APIs (Spotify Web API/OAuth and the existing YouTube endpoints)"
  - "Wake-word work, Android, and other deferred project items"

security_surfaces:
  - surface: "OAuth token lifecycle (scopes at sign-in, Keychain/EncryptedLocalStorage at rest, refresh handling, revocation on unlink; no tokens in logs)"
    requirements: ["NFR-SP-009", "NFR-SP-007", "FR-SP-008", "FR-SP-010"]
  - surface: "Client-secret handling for the client-credentials search flow (OD-S1 - open; bundled secrets are extractable)"
    requirements: ["FR-SP-009", "NFR-SP-002"]
  - surface: "Deep-link/URI injection: spotify: URIs are built from remote-controlled search results; track names/IDs validated before URI construction; a crafted result must not open arbitrary schemes"
    requirements: ["NFR-SP-008", "FR-SP-007"]
  - surface: "OAuth redirect validation: mismatched redirect URIs rejected (token interception via app-scheme hijacking)"
    requirements: ["NFR-SP-009", "FR-SP-008"]
  - surface: "Log sanitisation: music queries, provider responses and error bodies must not reach logs; check-release-log-safety.sh coverage"
    requirements: ["NFR-SP-002", "NFR-SP-011"]
  - surface: "Privacy disclosure: music-query/playback data flow to Spotify disclosed"
    requirements: ["FR-SP-016", "NFR-SP-011"]
  - surface: "Credential wipe/revocation on unlink"
    requirements: ["FR-SP-010", "NFR-SP-007"]
  - surface: "No new egress / no cloud LLM on the music path"
    requirements: ["NFR-SP-003"]

traceability:
  - gate: "design-l1"
    checks: "Resolve OD-S1 and OD-S3; address OD-S2 (owner/architect). Design the musicStub replacement at CommandRouter.swift:2640, the YouTubeRoute fall-through interplay, the SpotifyTool/plugin seams, the account-linking service and credential store; reconcile the pinned golden-corpus music entries."
  - gate: "design-l2"
    checks: "Component design against this set; interface contracts for SpotifyPlugin, SpotifyTool, the linking service, the credential store and the Settings surface."
  - gate: "review-l2"
    checks: "review.decision == GO against the component design and this set."
  - gate: "security-design-review"
    checks: "STRIDE for the security_surfaces above (OAuth lifecycle, client-secret handling, URI injection, redirect validation, log sanitisation, disclosure); SECURITY-GO required."
  - gate: "plan-tasks / implement"
    checks: "Plan units and implementation trace back to FR-SP-* / NFR-SP-* ids; paired review and 0.85 confidence on implementation output; rework bound 5."
  - gate: "security-test"
    checks: "Evidence: token storage (NFR-SP-007), release log-surface coverage (NFR-SP-002), hostile titles/IDs producing only validated spotify: URIs (NFR-SP-008), OAuth redirect validation (NFR-SP-009), credential wipe on unlink (FR-SP-010); SECURITY-GO required."
  - gate: "final-sign-off"
    checks: "T2 + HIL; ios/tools/check-release-log-safety.sh exits 0 (NFR-SP-002/NFR-SP-011); DV-* checklist recorded and passed on the reference device (FR-SP-017); privacy disclosure recorded (FR-SP-016)."
