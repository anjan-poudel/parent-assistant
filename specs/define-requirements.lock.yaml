# Requirements lock — Conversational Nepali Replies (v1)
#
# Contract: requirements_lock (ai-sdd task define-requirements).
# Snapshot of the feature requirements set produced from
# specs/define-requirements.md + specs/define-requirements/ (FR/ and NFR/).
# Downstream tasks (design-l1, design-l2, review-l2, security-design-review,
# plan-tasks, implement, review-implementation, security-test, final-sign-off)
# consume this file to stay in scope and to detect drift: if a requirement
# file's sha256 no longer matches, the requirement set has changed since this
# lock.
#
# Status: HIL gate RESOLVED (risk tier T1, per the feature workflow's
# define-requirements task). The owner approved the feature story on 2026-10-14
# ("please implement this as ai-sdd feature spec" —
# docs/features/2026-10-14-conversational-nepali-replies-proposal.md), so the
# owner-story HIL is resolved by that approval rather than re-asked at this
# step; the artifact is submitted for the coordinator's completion. The T2
# human gate sits at final-sign-off. No owner-level decision is open (see
# open_decisions); five design-level Open Decisions (OD-1..OD-5) are carried by
# the feature constitution and belong to design-l1/design-l2. Re-lock after any
# sign-off change; the hashes below are the drift-detection baseline.
#
# Note on scope: the FR/ and NFR/ folders also still contain the previously
# shipped call-dialer-primary-secondary files (FR-CDP-NNN-*, NFR-CDP-NNN-*),
# family-contacts-unify files (FR-FCU-NNN-*, NFR-FCU-NNN-*),
# live-camera-translation files (FR-LCT-NNN-*, NFR-LCT-NNN-*),
# profile-interview files (FR-PI-NNN-*, NFR-PI-NNN-*),
# spotify-music-integration files (FR-SP-NNN-*, NFR-SP-NNN-*) and
# multi-turn-conversation files (FR-MTC-NNN-*, NFR-MTC-NNN-*); they are left
# in place and are NOT part of this lock. This lock covers the
# conversational-nepali-replies set only (FR-CNR-* / NFR-CNR-*).

