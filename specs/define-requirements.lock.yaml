assumptions:
  - id: A1
    statement: "The existing integration surfaces named in the feature constitution and scaffold probe exist and are reused: OnboardingState / OnboardingWizardView, FamilyContactStore (with isEmergencyContact), SpeakerBiometricService / VoiceEnrollmentRecorder / VoiceSettingsView, VoicePipeline.handleWakeDetected, the shared IntentPrompt builder for the cloud (Gemini) and on-device (LLaMA) brains, and the EncryptedFileStorage storage pattern."
    source: "feature constitution Integration Surfaces; specs/profile-interview/init-report.md (scaffold probe)"
  - id: A2
    statement: "The wake-detection path (VoicePipeline.handleWakeDetected) is the hook for the acknowledgment; wake-word recognition itself is unchanged and out of scope."
    source: "feature constitution Address-as Behaviour Contract and Out of scope"
  - id: A3
    statement: "InputSanitiser discipline (quarantine level) exists and is the required treatment for the user-entered profile strings before they enter any prompt."
    source: "feature constitution Feature Constraint 4; project constitution Standards (Injection detection at quarantine level)"
  - id: A4
    statement: "IntentPrompt templates run in a 1,024-token on-device context, are pinned by IntentPromptTests' character ceiling, and are byte-mirrored by tools/train-intent/seeds/prompt_template.txt."
    source: "feature constitution Feature Constraints 1–2"
  - id: A5
    statement: "A helping family member may fill the interview in on the primary user's behalf at the device; no remote-companion flow is in scope for this feature."
    source: "feature constitution Feature Purpose & Scope; init-report owner brief"
  - id: A6
    statement: "Date of birth is captured for the profile record only; no behaviour in this feature reads it. Recorded so the field is not silently consumed."
    source: "feature constitution Field Contract (DOB optional); elicitation"
  - id: A7
    statement: "The project build/test gate is ios/build.sh; the release-build log-surface gate is ios/tools/check-release-log-safety.sh (wired into ios/build.sh)."
    source: "project constitution Release gates; workflow.yaml final-sign-off comment"

constraints:
  - id: C1
    statement: "Architecture Constraint 1 (all AI inference on-device) applies; the feature adds no new cloud processing and no new network egress. Existing recorded exceptions (Open Decisions 12 and 13) are untouched."
    source: "constitution Architecture Constraint 1; feature constitution Out of scope"
  - id: C2
    statement: "The address-as term and name are untrusted user input composed into prompts: they must pass the InputSanitiser discipline and must not be able to alter reply-style rules, tool/intent routing, authentication or safety behaviour."
    source: "feature constitution Feature Constraint 4; workflow.yaml security-design-review focus"
  - id: C3
    statement: "Profile PII at rest (name, address-as, DOB, GP, hospital, next of kin) must be in encrypted local storage (Keychain, Data Protection Complete) and must not appear in logs (log sanitiser covers the new fields)."
    source: "feature constitution Feature Constraint 5; project constitution Standards (Security, Privacy)"
  - id: C4
    statement: "All new UI strings are externalised to the L10n string catalogs; the address-as term is user data spoken verbatim and is never localized or routed through the catalogs."
    source: "feature constitution Feature Constraint 3; project constitution Standards (Localisation)"
  - id: C5
    statement: "Prompt edits preserve the pinned token budget and keep IntentPromptTests passing; tools/train-intent/seeds/prompt_template.txt is updated byte-identically in the same change."
    source: "feature constitution Feature Constraints 1–2"
  - id: C6
    statement: "The voice-biometric enrollment/verification mechanism is reused as-is: no mechanism change, biometric data exclusively in Secure Enclave storage, no new permissions, existing threat model unchanged."
    source: "feature constitution Feature Constraint 6 and Out of scope"

open_decisions:
  - id: OD-F1
    statement: "Next-of-kin data shape: standalone field in the new profile store, or a designation on an existing FamilyContact via the existing isEmergencyContact flag. Both data paths already exist; the choice must be reflected in the field table and the emergency-contacts step design."
    resolves_at: "design-l1 / design-l2"
  - id: OD-F2
    statement: "Wake-acknowledgment phrasing and locale handling: TTS of a hajur-<address-as> template vs pre-rendered AckFastLane variants, and how the surrounding acknowledgment copy is localized when the term is in a different script/language from the active app language. The term itself must always be spoken verbatim."
    resolves_at: "design-l1 / design-l2"
  - id: OD-F3
    statement: "About-you skip affordance vs the wizard's 'no hard gate' contract: keep the header Skip on first run (soft gate, deferral via the Home reminder card) or disable Skip (hard gate). Either way the reminder-card reopen + Settings editor path applies to already-onboarded users."
    resolves_at: "design-l1 / design-l2"
  - id: OD-PI-4
    statement: "Address-as input affordance (raised in elicitation): free-text entry vs a preset list of common terms, and what counts as 'filled' beyond non-blank after trimming. Requirements bind 'required, gates Next' only."
    resolves_at: "design-l1 / design-l2"
  - id: OD-PI-5
    statement: "Settings editor authentication (raised in elicitation): requirements.md FR-042 requires in-app configuration behind voice-biometric or PIN authentication, while the biometric/PIN gate is recorded as unwired with accepted residual risk (project constitution Open Decision 11, B3). FR-PI-012 binds the editor's existence, reachability, persistence and effect — not the auth gate."
    resolves_at: "owner review at the define-requirements HIL gate / design-l1"
    owner: "Anjan Poudel"

out_of_scope:
  - "Wake-word recognition changes (the wake word and its detection are untouched; only the post-detection acknowledgment is added)"
  - "Any new cloud processing / new network egress (only name/address-as may enter the existing prompt paths)"
  - "Emergency-call logic changes (collected data becomes available to the existing safety paths; their logic, triggers and stubs are unchanged)"
  - "Forcing address-as into every sentence (natural use only)"
  - "New permissions, HealthKit use, or changes to the existing voice-biometric enrollment/verification mechanisms"
  - "Scheduled auto-activation / daily-briefing and reminder copy (unchanged by this feature)"
  - "Remote companion-app push of profile fields (interview completed at the device; a helping family member may fill it in on the user's behalf)"
  - "Profile export/deletion flows (GDPR deferred, project constitution Open Decision 2; the store must not block future erasure/export)"

security_surfaces:
  - surface: "User-entered profile strings (address-as, name) reaching the shared cloud/on-device prompt (instruction injection)"
    requirements: ["NFR-PI-004", "FR-PI-009"]
  - surface: "Profile PII at rest (name, address-as, DOB, GP, hospital, next of kin) in encrypted local storage"
    requirements: ["NFR-PI-001", "FR-PI-003"]
  - surface: "Log surface (no name/term/DOB/emergency-contact values in any build)"
    requirements: ["NFR-PI-002", "FR-PI-015"]
  - surface: "Egress leakage (zero new calls; only name/term may be composed into prompts; no other profile fields leave the device)"
    requirements: ["NFR-PI-003", "FR-PI-009", "FR-PI-008"]
  - surface: "Voice fingerprint enrollment data (Secure Enclave only; mechanism unchanged; existing threat model)"
    requirements: ["NFR-PI-009", "FR-PI-007"]
  - surface: "Un-personalized fallback integrity (no placeholder, no partial application, no regression)"
    requirements: ["FR-PI-011", "FR-PI-015", "NFR-PI-010"]

traceability:
  - gate: design-l1
    checks: "Resolve OD-F1, OD-F2, OD-F3, OD-PI-4, OD-PI-5; feature architecture for store, wizard, prompt-injection point, wake-ack path"
  - gate: design-l2
    checks: "Component design against this set; interface contracts for the profile store, the sanitised prompt composition and the wake-ack path"
  - gate: review-l2
    checks: "review.decision == GO against the component design and this set"
  - gate: security-design-review
    checks: "STRIDE for the security_surfaces above (profile-string injection, PII at rest, voice-fingerprint reuse, wake-ack path); SECURITY-GO required"
  - gate: security-test
    checks: "Evidence for NFR-PI-001 (encryption), NFR-PI-002 (log surface), NFR-PI-003 (no new egress), NFR-PI-004 (injection), NFR-PI-009 (biometric data at rest); SECURITY-GO required"
  - gate: final-sign-off
    checks: "T2 + HIL; ios/tools/check-release-log-safety.sh exits 0 (NFR-PI-002/NFR-PI-011); privacy disclosure update recorded"
