assumptions:
  - id: A1
    statement: "The integration surfaces exist as named in the feature constitution; the cited anchors were spot-verified against the worktree source at requirements time (CommandRouter.route at 740, the confirmation hook at 785-886, the keyword-ladder music arm at 1223-1234, routeKeywordRemainder at 1968-2030, selectMusicOutcome/fireMusicRequest/runMusicTurn at 2614/2667/2684, the interpreted .music path at 3336-3355, KeywordIntentRule.musicQuery at 752-779, VoiceSessionStateMachine states/timer at 9-17/93-96/183-203, the 60 s voice watchdog, the IntentPromptTests 3,000-character pin, maxTokenCount: 1024). Remaining feasibility-study §10 line references not cited above are study-derived."
  - id: A2
    statement: "Exact user-facing copy (probe wording, default-play phrase, cancel/escape lines, honest lines) is OD-M1/OD-M2/design-dependent; the Nepali/English examples in this set are illustrative and localization-bound — the L10n keys must exist in both languages (NFR-MTC-006)."
  - id: A3
    statement: "The curated catalog's exact contents (e.g. the bhajan deity list) are data refined at design time; the requirement binds the catalog's existence, on-device sourcing, localisability and canonicalisation behaviour (FR-MTC-015)."
  - id: A4
    statement: "v16 and v17 are the study's and constitution's iteration labels for the existing slot-canonical fine-tune and the Phase 2 follow-up fine-tune; the actual artifacts land via the Phase 2 training iteration (FR-MTC-018) — nothing in Phase 1 depends on a training run."
  - id: A5
    statement: "The project's known pre-existing test failures (unrelated to this feature) remain the baseline for NFR-MTC-012; the feature's own suites and touched suites must pass, with baseline failures recorded rather than silently included or excluded."
  - id: A6
    statement: "The 45 s deadline is the existing confirmation timer value (VoiceSessionStateMachine.confirmationTimeoutSeconds = 45); reuse mechanics are design's to fix, the value is binding."
  - id: A7
    statement: "DialogueManager, DialogueFrame, awaitingSlotAnswer, probeKind and the curated catalog were confirmed absent from the worktree source at requirements time — they are genuinely new surfaces."

constraints:
  - id: C1
    statement: "Emergency precedence is absolute: emergency keywords always win mid-dialogue; the override is checked before any frame merge; emergency dispatch and medication re-fire are frame-independent and behave exactly as today; a hostile or corrupted answer cannot bypass the emergency precedence rule."
    source: "feature constitution Safety-Relevant Constraint 1 (verified: worktree emergency handling precedes the ladder)"
  - id: C2
    statement: "Frames must never trap the user: cancel words drop the frame with an honest line; a strong new-command barge-in drops the frame and executes the new command; ambiguous utterances are treated as answers; a 45 s timeout silently drops and re-arms. Zero stuck states; no persistence across sessions."
    source: "feature constitution Safety-Relevant Constraint 2"
  - id: C3
    statement: "Privacy & log-safety stance unchanged: no new network egress; no new compliance regime; the on-device stance and existing encrypted stores are unchanged; free-text answers are sanitised through the existing input seam (InputSanitiser discipline) before any use; no raw transcripts may reach logs (B2/T-050 precedent) and ios/tools/check-release-log-safety.sh must keep passing."
    source: "feature constitution Safety-Relevant Constraint 3"
  - id: C4
    statement: "Security-review focus — the answer-capture path: STRIDE must treat it as a focus area; no new injection surface into routing; no log-safety regressions; a hostile or corrupted answer cannot bypass the emergency precedence rule; existing sanitisation discipline applies before the answer enters any routing or prompt context."
    source: "feature constitution Safety-Relevant Constraint 4"
  - id: C5
    statement: "1024-token ceiling: the brain context is a measured memory ceiling (2048 crashed 6 GB devices); dialogue state lives in the app, never as transcript history in prompts; any prompt clause must fit the ~300-token headroom inside the pinned IntentPromptTests budget."
    source: "feature constitution Feature Constraint 1; feasibility study §5.1"
  - id: C6
    statement: "Template-generated probes only (localized ne/en). Never model-generated. The model never writes probe text."
    source: "feature constitution Feature Constraint 2"
  - id: C7
    statement: "Probe budget: max 2 probes then execute with defaults; 3-4 spoken options with a default always offered (slotFill), 2-3 for candidateChoice; free-text answers always accepted."
    source: "feature constitution Feature Constraint 3"
  - id: C8
    statement: "Deterministic merge works with the brain absent or degraded — Phase 1's core guarantee: the frame survives a degraded or skipped brain turn and executes via the deterministic merge; the PR #156 hardening stays intact (per-turn STT release, pressure-tiered brain pick); brain-assisted merge is Phase 2 only."
    source: "feature constitution Feature Constraint 4"
  - id: C9
    statement: "The Phase 2 frame clause ships only together with the v17 training iteration; the clause stays inside the pinned prompt budget, is mirrored byte-identically in tools/train-intent/seeds/prompt_template.txt in the same change, and must not alter the .raw framing; no clause without training data."
    source: "feature constitution Feature Constraint 5"
  - id: C10
    statement: "KV-prefix stability: the frame clause must not mutate the byte-stable template prefix (the vendored LLM prefix-reuse path depends on it)."
    source: "feature constitution Feature Constraint 6; feasibility study §5.3"
  - id: C11
    statement: "Cache bypass: during awaitingSlotAnswer, the transcript cache (IntentCommandCache) is bypassed — answers are never cacheable inputs; only confirmed merged commands are recorded."
    source: "feature constitution Feature Constraint 7"
  - id: C12
    statement: "Delivery gates: focused tests + typecheck per unit; full suite once at the end; device validation is the DV-* checklist on Anzaan (reference device)."
    source: "feature constitution Feature Constraint 8"
  - id: C13
    statement: "Phase 0 prerequisite: PR #156 voice-OOM hardening is merged (437631e, 2026-10-10); its device smoke (conversation → no jetsam → pull JetsamEvent logs) is outstanding — that outstanding smoke is the Phase 0 prerequisite for this feature."
    source: "feature constitution Feature Constraint 9"
  - id: C14
    statement: "iOS only. No platform scope beyond the existing iOS app."
    source: "feature constitution Feature Constraint 10"

open_decisions:
  - id: OD-M1
    statement: "Probe policy: 1 probe vs up-to-2 before executing with defaults, and the default-play wording ('जे पनि बजाऊ'). Study recommendation: 2 probes max, default offered on the first probe. The requirements bind a bounded probe budget, the always-present default and execution-with-defaults on exhaustion (FR-MTC-007, FR-MTC-003); the exact cap and default copy stay open."
    resolves_at: "owner; recorded in design-l1"
    owner: "owner"
  - id: OD-M2
    statement: "Probe option source: curated on-device catalog (recommended for MVP: zero latency, on-device stance) vs live Spotify playlist search (richer; needs a SpotifyTool extension + network per probe). The requirements bind the curated on-device catalog for Phase 1 (FR-MTC-015) and no new egress (NFR-MTC-003); a later live-search enrichment resolves here."
    resolves_at: "owner + design-l1"
    owner: "owner / architect"
  - id: OD-M3
    statement: "Sequencing: ship Phase 1 deterministic-only first vs run Phase 2 + v17 in parallel. Study recommendation: Phase 1 first (it covers the bhajan example), v17 data authoring in parallel. The requirements mark Phase 2 (FR-MTC-018) as SHOULD pending this resolution; Phase 1 is complete and shippable alone."
    resolves_at: "owner"
    owner: "owner"
  - id: OD-M4
    statement: "Scope: whether Phase 3's reminder/calendar answer-capture (fixing today's stateless re-prompts) rides the same release as the music probe. The requirements keep reminder/calendar unchanged in Phase 1 (FR-MTC-019 Phase 1 guard; NFR-MTC-012) and carry the Phase 3 target as SHOULD."
    resolves_at: "owner"
    owner: "owner"

out_of_scope:
  - "Open-ended conversation/chat (the fine-tunes have no conversational mode; probes are the only new dialogue; the stakeholder brief's FR-008 conversational-response clause is not delivered or superseded by this feature)"
  - "Raw transcript history in prompts (the 1024-token ceiling is a measured memory limit; dialogue state lives in the app)"
  - "Model-generated probe text (probes are template-generated, localized ne/en; the model's only multi-turn job is classifying the answer)"
  - "Cloud / BYO-LLM anything (no new network egress; the on-device stance is unchanged)"
  - "Persistent dialogue state across sessions (frames are in-memory only; a cold start has no frame)"
  - "Reminder/calendar changes in Phase 1 (those turns are unchanged until Phase 3 and the OD-M4 resolution)"
  - "Android (no platform scope beyond the existing iOS app)"
  - "Emergency/medication behaviour changes of any kind (emergency precedence preserved absolutely)"
  - "Any new compliance regime, permission, data store or egress host (existing disclosures and gates unchanged)"

security_surfaces:
  - surface: "Emergency precedence mid-dialogue: emergency keywords win mid-frame; a hostile or corrupted answer cannot bypass the override"
    requirements: ["FR-MTC-011", "NFR-MTC-010"]
  - surface: "Free-text answer injection: answers enter routing mid-frame; the interception must open no new injection surface into routing or prompt context"
    requirements: ["NFR-MTC-008", "FR-MTC-009", "FR-MTC-017"]
  - surface: "Frame-trap resistance: cancel, barge-in and the 45 s timeout must always recover; zero stuck states"
    requirements: ["FR-MTC-010", "FR-MTC-012", "FR-MTC-013", "NFR-MTC-010"]
  - surface: "Log sanitisation: probe texts and captured answers must not reach logs (B2/T-050 precedent); check-release-log-safety.sh coverage"
    requirements: ["NFR-MTC-004", "NFR-MTC-012"]
  - surface: "No new egress: probes and answers stay on-device (no cloud/BYO-LLM path)"
    requirements: ["NFR-MTC-003"]
  - surface: "Degraded-brain path: the deterministic merge must not weaken the emergency/safety gates"
    requirements: ["NFR-MTC-005", "FR-MTC-011"]

traceability:
  - gate: "design-l1"
    checks: "Resolve/design with OD-M1..M4 (the study's recommendations are inputs): DialogueFrame shape + probeKind enum; the interception seam in CommandRouter.route (generalize the confirmation hook ~785-886) and its ordering vs emergency keywords; awaitingSlotAnswer + 45 s timer reuse; degenerate-query detection in the music path (KeywordIntentRule.musicQuery); the curated catalog format (localizable ne/en); how the frame survives the degradation ladder (PR #156 pressure-tiered picks); the Phase 2 frame-clause budget within the pinned prompt and the v17 training-mirror requirement."
  - gate: "design-l2"
    checks: "Component design against this set; interface contracts for DialogueManager/DialogueFrame, the interception seam, the catalog, the probe templates and the session state."
  - gate: "review-l2"
    checks: "review.decision == GO against the component design and this set."
