assumptions:
  - id: A1
    statement: "v1 target language is the app's active language (Nepali at launch) and v1 source text is English; the pipeline stays direction- and language-agnostic so wider source languages and the reverse direction are model/prompt work, not architecture work."
    source: "design §0, §1; feature constitution rule 9"
  - id: A2
    statement: "The cloud tier (Gemini) is the only translation egress and it ships under the recorded project-constitution exception Open Decision 13 (2026-09-16), consent-gated, text-only, bounded by GeminiCostGovernor."
    source: "constitution Open Decision 13; design §7"
  - id: A3
    statement: "Vision (VNRecognizeTextRequest with automatic language detection) on the app's existing deployment target provides on-device OCR with no model download."
    source: "design §4.2"
  - id: A4
    statement: "Piper voices, SpeakQueue, DesignTokens, StoragePlacement/encrypted storage, String Catalog localisation and the plugin registry already exist and are reused."
    source: "design §3, §6; feature constitution Known integration surface"
  - id: A5
    statement: "Accessibility standards of the project constitution (44 pt targets, 18 pt body text, high contrast) bind this feature."
    source: "project constitution Standards (Accessibility); feature constitution rule 6"

constraints:
  - id: C1
    statement: "Architecture Constraint 1 (all AI inference on-device) applies; the tier-2 cloud text call exists only under the recorded exception in Open Decision 13, with consent, indicator and revocation."
    source: "constitution Architecture Constraint 1; Open Decision 13"
  - id: C2
    statement: "No agent may add a cloud call path that is not behind the consent gate; no agent may weaken the contract of ApplianceOverlayMapper or ApplianceLabelLocalizer (extended, not modified)."
    source: "feature constitution Agent Principles"
  - id: C3
    statement: "Deferred work must be absent, not a silent stub: TranslationResult.sourceTier always reports the tier that produced the string and no tier may return success when it did not translate."
    source: "feature constitution v1 non-goals"
  - id: C4
    statement: "Every operational constant this feature adds (OCR throttle, declutter thresholds, hysteresis, timeouts, retry counts, cache bound) is a configurable parameter with a documented default."
    source: "constitution Agent Principles; feature constitution rule 7"
  - id: C5
    statement: "Build and test gate is ios/build.sh (which runs xcodebuild test); release log-safety gate is ios/tools/check-release-log-safety.sh."
    source: "feature constitution Standards"

open_decisions:
  - id: OD1
    statement: "OCR throttle rate: ~4 fps nominal needs a device spike on mid-range hardware before commitment; must land as a configurable parameter."
    resolves_at: "implementation on device"
  - id: OD2
    statement: "In-place replacement default: smart mix approved; the 'always show original text' toggle ships with it; confirm the default at the first device demo."
    resolves_at: "first device demo"
  - id: OD3
    statement: "Consent/disclosure copy: the exception amendment is recorded (Open Decision 13, 2026-09-16); drafting and reviewing the copy remains, alongside the Open Decision 12 review window (2026-10-13)."
    resolves_at: "before final-sign-off"
    owner: "Anjan Poudel"
  - id: OD4
    statement: "Tier-1 on-device NMT (v1.1 candidate, NLLB-200 distilled 600M): requires revisiting addendum §13.5's non-goal before any model work."
    resolves_at: "v1.1 planning (not this workflow)"
  - id: OD5
    statement: "Menu-mode declutter thresholds (IoU >= 0.3, centroid distance 0.06, 8-region cap, longest-string merge): nominal, validate on device; may become per-scene settings."
    resolves_at: "manual device testing"
  - id: OD6
    statement: "Reverse phrase-card mode (user language -> scene language): out of v1 scope; v1.x extension reusing this pipeline."
    resolves_at: "not in this workflow"
  - id: OD7
    statement: "Cost governor scope: design §4.4 and Open Decision 13 say per-session while the shipped GeminiCostGovernor counts calls per day with a family-editable cap; requirements bind fail-closed behaviour, the mechanism is a design decision."
    resolves_at: "design-component"
  - id: OD8
    statement: "Shared cache ownership: the design names the store LabelTranslationCache while the feature constitution records that the shared translation cache does not exist yet and is new work; requirements state behaviour (one persistent encrypted shared store) without fixing a type name."
    resolves_at: "design-component"

out_of_scope:
  - "NE->EN direction (v1 is English source -> Nepali target; no reversed translation delivered)"
  - "Reverse phrase-card mode (user language -> scene language)"
  - "ARKit world-anchored 3D rendering (screen-space overlay only)"
  - "Auto-speak of every new translation (tap-to-hear and \"read this to me\" only)"
  - "Live full-scene explanation (remains the appliance helper's one-shot identifyAppliance call)"
  - "The on-device NMT tier (tier 1) - v1.1 candidate, blocked until addendum §13.5's non-goal is revisited"
  - "Family/caregiver configuration surface for this feature"
  - "Changes to the existing feed translation path"
  - "Devanagari source text (Nepali source -> any target, and Nepali/Devanagari OCR). Explicit v1 non-goal, owner-signed at the security-test gate. The pipeline stays language-agnostic by design (FR-LCT-003), but v1 makes no recognition claim for Devanagari. Reason is measured, not assumed: on iOS 26.5 Vision resolves to revision 3 with 30 supported languages and no Devanagari-capable code, a rendered Nepali frame yields zero observations under both the platform default and an explicit hi-IN request, and the API reports no error for an unsupported language. Record: specs/hi-in-probe-notes.md."

divergences:
  - id: D1
    prior: "Addendum §13.3/§13.5: callout only, no text replacement"
    now: "Smart mix: in-place replacement only for short dictionary-known labels whose translation fits at >= 18 pt; anchored callouts otherwise; always-show-original toggle ships with it (FR-LCT-015/016/017)"
    status: "owner-approved 2026-09-16"
  - id: D2
    prior: "Addendum §13.5: no on-device translation model"
    now: "v1 identical (no model); tier 1 absent from v1, recorded as a v1.1 candidate (FR-LCT-008)"
    status: "owner-approved 2026-09-16; revisit before v1.1"
  - id: D3
    prior: "Addendum §13.2: LabelTranslationCache in-memory, no LRU"
    now: "Persistent encrypted cache with LRU for general text (~200 entries); labels effectively non-evicting (FR-LCT-019)"
    status: "new requirement"
  - id: D4
    prior: "Base design §0/§5.1: never obscure/redraw reality"
    now: "Preserved for all non-in-place cases; in-place bounded by D1's rule (FR-LCT-016)"
    status: "consequence of D1"
  - id: D5
    prior: "Addendum scope: appliance labels"
    now: "Any printed text, including dense multi-region scenes such as a menu page (FR-LCT-006)"
    status: "owner requirement (abroad scenario)"

security_surfaces:
  - surface: "Untrusted OCR scene text reaching the cloud prompt (instruction injection)"
    requirements: ["NFR-LCT-009", "FR-LCT-009"]
  - surface: "Consent-gate enforcement (no tier-2 call without recorded, explicit, revocable consent)"
    requirements: ["NFR-LCT-007", "FR-LCT-010", "FR-LCT-012"]
  - surface: "Egress leakage (images never leave the device; never health/contacts/profile content)"
    requirements: ["NFR-LCT-005", "FR-LCT-014", "FR-LCT-001"]
  - surface: "Persistent cache = user content at rest (encrypted, keyed, evictable)"
    requirements: ["NFR-LCT-008", "FR-LCT-019"]
  - surface: "Cloud indicator present and not spoofable while tier 2 is active"
    requirements: ["FR-LCT-011"]
  - surface: "Offline degradation never silently reports success"
    requirements: ["NFR-LCT-010", "FR-LCT-023", "FR-LCT-008"]
  - surface: "Cost governor cap must fail closed"
    requirements: ["FR-LCT-013"]
  - surface: "Log surface (no raw OCR or translation text, no upstream error body)"
    requirements: ["NFR-LCT-006"]

traceability:
  - gate: review-l2
    checks: "L2 design folds in D1/D2 and resolves OD1, OD2, OD5, OD7, OD8 where resolvable on paper"
  - gate: security-design-review
    checks: "STRIDE for the camera + cloud-egress surface (security_surfaces above)"
  - gate: security-test
    checks: "Evidence for consent enforcement, text-only egress, log surface, degradation integrity, governor fail-closed"
  - gate: final-sign-off
    checks: "Recorded exception amendment (Open Decision 13), consent copy review, camera purpose string, log-safety gate"
