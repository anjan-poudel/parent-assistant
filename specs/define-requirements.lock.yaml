assumptions:
  - id: A1
    statement: "The integration surfaces exist as named in the feature constitution; the cited anchors were spot-verified against the worktree source at requirements time (FamilyContact struct at FamilyContactStore.swift:61, single nickname :71, photoFilename :69, custom decoder :122-150; UnifiedContactSearch.dedupe(matchedFamily:in:) :269, FamilyMatchTier :155, familyMatches :217; ContactsAccess AddressBookDirectory.swift:245, allEntries() :386, fetch keys :333; ContactResolver.relationshipAnchors :41, scoring :93, accept 0.6 / ambiguity margin 0.15 :61-62; MethodResolver.resolve :47; ContactPhotoStore non-throwing save/load/delete; FamilyContactsSettingsView SettingsView.swift:1529, nickname step :2575, PhotosPicker :2485, picked-photo load :2511; CallView LeafViews.swift:918, family rows :1747, UnifiedContactResultRow :2288, ContactTile avatar :2559+; AppCoordinator.contactPhoto(for:) :6492, addFamilyContact :6515, updateFamilyContact :6566; NSContactsUsageDescription Info.plist:115; Localizable.xcstrings present; L10nCatalogCoverageTests and ios/tools/check-release-log-safety.sh present)."
  - id: A2
    statement: "Design-level choices are deliberately left open and are NOT requirements: the link's storage shape and identifier strategy (FR-FCU-002/006); the system-contact write seam's file/name and injection shape (FR-FCU-008); the nickname index structure (NFR-FCU-001); unlink mechanics and UI (FR-FCU-005); which representation a linked row renders (FR-FCU-003); whether strict number-matching may establish a counterpart for an UNLINKED family contact for photo display (FR-FCU-007; not required); removal semantics for a linked contact's photo beyond the FR-FCU-008/010 invariants; whether nicknames feed ContactResolver.nearMiss (not required; the name-only discipline may be extended conservatively at design's option)."
  - id: A3
    statement: "Non-family book rows (system contacts without a family record) keep today's presentation — initials avatar, no photo rendering — unchanged by this feature."
  - id: A4
    statement: "Exact user-facing copy (link flow, photo fallback labels, permission copy, nickname editor) is design-dependent and localization-bound; the ne/en keys must exist per NFR-FCU-004."
  - id: A5
    statement: "The project's known pre-existing full-bundle test failures (unrelated to this feature) remain the baseline for NFR-FCU-009; the feature's own and touched suites must pass, with baseline failures recorded rather than silently included or excluded."

constraints:
  - id: C1
    statement: "Explicitly distinct from call-dialer-primary-secondary; sequencing. Do not absorb or redesign it. Implementation merges master AFTER its PR merges (queue behind it), expecting conflicts in MethodResolver.swift / LeafViews.swift family-contact call surfaces."
    source: "feature constitution Feature Constraint 1; Sequencing Note (scaffold base master 8089c735)"
  - id: C2
    statement: "Migration rule. New model fields optional with custom-decoder defaults; pre-existing payloads (single nickname, photoFilename) must keep loading; the existing single nickname migrates into the multi-nickname structure without loss."
    source: "feature constitution Feature Constraint 2"
  - id: C3
    statement: "Matching semantics reused; grapheme behavior pinned. Nickname matching MUST reuse existing name-matching semantics (NepaliTextNormalizer folding + [.caseInsensitive, .diacriticInsensitive] Character-safe substring; relationship anchors on ContactResolver's table). The Devanagari substring / grapheme-cluster behavior is regression-pinned — do not \"fix\" it."
    source: "feature constitution Feature Constraint 3"
  - id: C4
    statement: "Photo write is best-effort with the pre-authorized fallback. Permission denied / limited access / read-only contact degrades to the app-local photo (ContactPhotoStore photoFilename) — never crash, never lose the picked photo, never claim an unverified success."
    source: "feature constitution Feature Constraint 4"
  - id: C5
    statement: "CNSaveRequest only, photo only. Writes are limited to the edited contact's photo; no bulk rewrites; no editing other fields of system contacts."
    source: "feature constitution Feature Constraint 5"
  - id: C6
    statement: "One person, one row. A linked pair is one person everywhere (search, call list, voice resolution); dedupe becomes link-aware beyond today's matched-only normalized-number rule; unlinked pairs keep today's matched-only behavior."
    source: "feature constitution Feature Constraint 6"
  - id: C7
    statement: "Nicknames indexed and matched in both surfaces. Multiple nicknames are indexed for match performance and match in BOTH search and voice resolution (ContactResolver/MethodResolver seams)."
    source: "feature constitution Feature Constraint 7"
  - id: C8
    statement: "No new network surface; no new data collection; PII discipline. Names, numbers and photos must not reach logs beyond existing policy (B2/T-050)."
    source: "feature constitution Feature Constraint 8"
  - id: C9
    statement: "Delivery — house rule (inherited). Work ONLY in the sibling worktree /Users/anjan/workspace/projects/elderly-ai-assistant-family-contacts-unify (branch feat/family-contacts-unify); integrate via PR against master; never the main checkout."
    source: "feature constitution Feature Constraint 9; project CLAUDE.md working rule"
  - id: C10
    statement: "Test gate. Scoped/focused XCTest suites are the honest gate (the full-bundle baseline has pre-existing failures): UnifiedContactSearchTests, FamilyContactStoreTests, ContactResolverTests, MethodResolverTests, ContactPhotoStoreTests, MissedCallContactResolverTests."
    source: "feature constitution Feature Constraint 10; project constitution Release gates"
  - id: C11
    statement: "Localization. All new user-visible strings ne/en in ios/ElderlyAssistant/Resources/Localizable.xcstrings."
    source: "feature constitution Feature Constraint 11"
  - id: C12
    statement: "Feasibility honesty. If any of the three asks proves infeasible on iOS (e.g. the write-permission model), the deliverable states it explicitly for the owner — no silent drop (the owner asked to be told)."
    source: "feature constitution Feature Constraint 12; owner request 2026-10-12"

