security_surfaces:
  - surface: "Chain dead-end: any (primary, secondary, feasibility) combination must resolve to
      an attemptable channel — GSM is the hard floor; the exhaustive configuration matrix
      (including equal picks) must show zero dead ends"
    requirements: ["NFR-CDP-001", "FR-CDP-006", "FR-CDP-007"]
  - surface: "Emergency precedence: emergency-contact semantics are untouched; missed-call
      dial-back and voice-initiated calls must never delay or divert an emergency escalation"
    requirements: ["FR-CDP-018", "FR-CDP-011", "FR-CDP-012"]
  - surface: "Announcement honesty: the spoken confirmation and the launch-fail announcement
      always name the actually-routed channel (fellBackFrom); no silent route changes"
    requirements: ["FR-CDP-013", "FR-CDP-015", "FR-CDP-016"]
  - surface: "Override protocol preserved: \"होइन, फोन नै गर\" still switches to a phone
      call pre-confirmation — a fallback hop must not bypass or weaken it"
    requirements: ["FR-CDP-014"]
  - surface: "PII exposure: numbers/handles (address-book + Messenger handles) must not reach
      logs beyond the existing transcript policy (B2/T-050); check-release-log-safety.sh must
      cover the new fallback/announcement paths"
    requirements: ["NFR-CDP-003", "NFR-CDP-010"]
  - surface: "No new egress: feasibility probes are local-only (canOpenURL + address-book
      handle check) — no new network, data, identity or privacy surface"
    requirements: ["NFR-CDP-002"]

traceability:
  - gate: "design-l1"
    checks: "Resolve the frozen design into L1 architecture: pure-static chain resolver
      placement + Feasibility/Result shapes (fellBackFrom attempt order); the
      resolvedCallChannel / resolvedMissedCallChannel seam changes; MethodResolver's
      global-default step made the settings primary (CallApp→CallMethod mapped by call type,
      injected); secondaryCallApp persistence (default .phone); fallback resolved before the
      spoken confirmation; launch-fail hop via the existing spoken-outcome lane; ne/en key
      catalog. The assumptions recorded at requirements time (copy wording, tap-announcement
      trigger point, launch-fail observation point, resolver placement) resolve here — none
      re-opens the frozen design."
  - gate: "design-l2"
    checks: "Component design against this set: interface contracts for the chain resolver
      (pure-static, closure-injected feasibility), the AppCoordinator seams, the MethodResolver
      injection, the settings sections/pickers, and announcement composition from fellBackFrom."
  - gate: "review-l2"
    checks: "review.decision == GO against the component design and this set."
  - gate: "security-design-review"
    checks: "STRIDE with the named focus: the GSM hard floor can never be configured away (no
      dead-end chain, including secondary == primary) (FR-CDP-006/007, NFR-CDP-001);
      emergency-contact semantics and the override protocol unchanged — dial-back never delays
      escalation (FR-CDP-014/018); feasibility probes local-only, handles/numbers are PII
      (NFR-CDP-002/003); the spoken confirmation always names the actually-routed channel
      (FR-CDP-013/015/016); SECURITY-GO required."
  - gate: "plan-tasks / implement"
    checks: "Units trace back to FR-CDP-* / NFR-CDP-* ids; paired review and the 0.85
      confidence threshold on implementation output; rework bound 5; unit-based dependency
      waves; no CallRouter service and no per-contact primary/secondary storage (FR-CDP-018)."
  - gate: "security-test"
    checks: "Evidence: the chain never dead-ends for any (primary, secondary) pair including
      equal values (dedupe) and uninstalled apps (NFR-CDP-001, FR-CDP-007); the GSM floor is
      reachable with every other channel infeasible (FR-CDP-006); the confirmation wording
      names the routed channel (FR-CDP-013); emergency/dial-back escalation unaffected
      (FR-CDP-018); number/handle PII is absent from logs and check-release-log-safety.sh
      covers the new paths (NFR-CDP-003, NFR-CDP-010); no new egress from the probes
      (NFR-CDP-002); SECURITY-GO required."
  - gate: "final-sign-off"
    checks: "T2 + HIL; DV-1..7 recorded and passed on the reference device (Anzaan)
      (FR-CDP-019); ios/tools/check-release-log-safety.sh exits 0 (NFR-CDP-003, NFR-CDP-010)."
