# Feature workflow: reminders-instructions-enhancements
# Safety delta: none
# Generated by: ai-sdd scaffold
# Workflow: Full Feature Pipeline
#
# WHO:    Brownfield feature in an existing product — multi-phase scope
# WHEN:   A feature that needs architecture and component design before implementation
# AGENTS: ba → architect → reviewer → pe → reviewer → le → dev → reviewer (all 6)
# HIL:    on for requirements (stakeholder sign-off) and L1 architecture
# GATES:  review gates at L1 architecture, L2 component design, and implementation

version: "1"
name: full-feature
description: "Full feature pipeline: requirements → L1 architecture → reviewed L2 design → reviewed task plan → reviewed implementation"

defaults:
  risk_tier: T1
  max_rework_iterations: 3

tasks:
  define-requirements:
    use: define-requirements

  design-l1:
    use: design-architecture
    depends_on: [define-requirements]

  review-l1:
    use: review-l1
    depends_on: [design-l1]

  design-l2:
    use: design-component
    depends_on: [review-l1]

  review-l2:
    use: review-l2
    depends_on: [design-l2]

  plan-tasks:
    use: plan-tasks
    depends_on: [review-l2]

  implement:
    use: standard-implement
    depends_on: [plan-tasks]
    execution_mode: unit_based
    unit_execution:
      plan_task_id: plan-tasks
      # parallelism: waves is the default when absent — the plan's units are
      # topologically sorted into dependency waves and dispatched in parallel
      # groups (set "sequential" to opt out).

  review-implementation:
    use: review-implementation
    depends_on: [implement]
