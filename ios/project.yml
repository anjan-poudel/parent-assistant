# XcodeGen spec for ElderlyAssistant.
#
# Generate the .xcodeproj with:  xcodegen generate
# (installed via `brew install xcodegen` — see ios/build.sh).
#
# Source of truth for the iOS project structure. Do NOT edit
# ElderlyAssistant.xcodeproj/project.pbxproj by hand — regenerate it from
# this file so history stays legible.

name: seniOS
options:
  bundleIdPrefix: com.elderlyassistant
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Foundation's bundle lookup ignores lproj folders not listed here
  # (CFBundleLocalizations) — without "ne", String(localized:locale:)
  # falls back to English even though ne.lproj ships in the bundle,
  # while SwiftUI's Text(catalog) path resolves it (the split where the
  # Talk button was English but the hub cards were Nepali).
  knownRegions:
    - Base
    - en
    - ne

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # The team whose Apple ID is signed into Xcode on this machine
    # (Xcode's automatic signing selected BKXWPS4X87 for device builds;
    # the older BUKS428XA3 cert belongs to a previous session).
    DEVELOPMENT_TEAM: "BKXWPS4X87"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Wake word (Porcupine) — commented until access key + trained .ppn are
# provisioned. See docs/voice-pipeline-setup.md.
#
# whisper.cpp (real Nepali STT) — enabled on branch master. Once the
# runtime is linked, WhisperSpeechRecognizer.isAvailable flips to true and
# AppCoordinator hot-swaps it in over the SFSpeechRecognizer fallback.
packages:
  # whisper.cpp itself has no Package.swift at repo root — use exPHAT's
  # community wrapper (Swift binding around whisper.cpp with iOS +
  # Accelerate + optional CoreML), VENDORED so we can carry the compute-
  # pool headroom patch for the distilled student's non-standard dims
  # (vendor/SwiftWhisper/whisper.cpp/whisper.cpp, "HEADROOM PATCH").
  SwiftWhisper:
    path: vendor/SwiftWhisper
  # Thin Swift wrapper around llama.cpp with Metal. Provides the `LLM`
  # module and a Template abstraction (llama3, chatML, etc). Used by
  # LlamaCommandInterpreter to run LLaMA 3.2 on-device. VENDORED
  # (vendor/LLM.swift) to carry the Metal offload patch — upstream pins
  # n_gpu_layers to llama.cpp's CPU default even though the XCFramework
  # ships Metal (vendor/LLM.swift/Sources/LLM/LLM.swift, 2026-09-06).
  LLM:
    path: vendor/LLM.swift
  # ANE-accelerated whisper runtime (Apple's CoreML path). Replaces
  # SwiftWhisper for STT: the vendored whisper.cpp predates Metal, and
  # ANE beats the iPhone GPU for whisper workloads (see
  # docs / memory ios-stt-runtime-decision). Supports 128-mel models
  # (built around large-v3-turbo) — the 128-mel Nepali teacher converts
  # directly.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    branch: main
  # Zip extraction for the downloadable ANE encoder delivery (M2).
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  # On-device TTS runtime (VITS + espeak-ng phonemization) — iOS static
  # xcframework via SPM binary targets. Powers PiperVoiceSpeaker with the
  # bundled Nepali/English Piper voices (docs/tts-implementation-plan.md).
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.7
  # Porcupine:
  #   url: https://github.com/Picovoice/porcupine.git
  #   from: 3.0.0

targets:
  ElderlyAssistant:
    type: application
    platform: iOS
    sources:
      - path: ElderlyAssistant
        excludes:
          - "Info.plist"
          - "Resources"
      # String Catalog — a resources build phase is NOT auto-assigned to a
      # single-file `resources:` entry, so declare it as a source with an
      # explicit buildPhase. Without this the catalog never lands in the
      # app bundle and every Text("key") renders as the raw key.
      - path: ElderlyAssistant/Resources/Localizable.xcstrings
        buildPhase: resources
      # Bundled dialect-ID centroid table (voice-personalisation P0 slice D).
      # SEED-CENTROIDS placeholder — regenerate from field corpora with
      # tools/generate-seed-dialect-centroids.py (schema + loader:
      # Services/Voice/DialectIdentifier.swift). Same single-file pattern
      # as Localizable.xcstrings: without this entry the table never lands
      # in the app bundle and DialectCentroidTable.bundled() finds nothing.
      - path: ElderlyAssistant/Resources/DialectCentroids.json
        buildPhase: resources
      # Bundled per-dialect lexicon for decode biasing ([ACCENT-ADAPT],
      # accent-adaptation.md P0.3 — tag lines + known dialect words per
      # label). SEED-LEXICON placeholder pending linguist review. Same
      # single-file pattern as DialectCentroids.json: without this entry
      # the file never lands in the app bundle and
      # DialectLexicon.bundled() finds nothing.
      - path: ElderlyAssistant/Resources/DialectLexicon.json
        buildPhase: resources
      # Official multicolor logos for the quick-access app catalog
      # (Wikimedia Commons PNGs, 2026-09-07 — sources in the catalog's
      # README.md). `Resources` is excluded from the source glob above, so
      # the asset catalog must be declared like every other bundled
      # resource.
      - path: ElderlyAssistant/Resources/AppIcons.xcassets
        buildPhase: resources
      # [TIMER-ALARM] The loud timer-alarm bell loop (CC0, synthesized from
      # scratch by tools/generate-timer-alarm-bell.py — license note in
      # Resources/TimerAlarmBell.LICENSE.txt). Bundled for the in-app
      # looping AVAudioPlayer AND the pre-iOS-26 UN notification fallback
      # sound (custom notification sounds must be <= 30 s, linear PCM —
      # this is ~4.6 s). Same single-file resource pattern as above.
      - path: ElderlyAssistant/Resources/timer-alarm-bell.wav
        buildPhase: resources
      # [LAUNCH-SCREEN] The pre-first-paint launch screen. Info.plist
      # already sets UILaunchStoryboardName=LaunchScreen; without this
      # resource entry the storyboard never lands in the bundle and iOS
      # renders pure black during the pre-paint phase. Same single-file
      # pattern as the entries above (Resources is excluded from the
      # source glob). Base.lproj is the standard launch-screen slot.
      - path: ElderlyAssistant/Resources/Base.lproj/LaunchScreen.storyboard
        buildPhase: resources
      # Bundled medium Nepali model — installed into the ModelStore on
      # first launch (no download). The .bin itself is gitignored
      # (*.bin); re-fetch from the models release v3 to rebuild locally.
      - path: ElderlyAssistant/Resources/Models/whisper-medium-ne-q5_1.bin
        buildPhase: resources
      # Bundled TTS voices (sherpa-layout dirs: model.onnx + tokens.txt +
      # espeak-ng-data/), installed into the ModelStore on first speak.
      # Gitignored — fetch with tools/fetch-tts-voices.sh before building.
      - path: ElderlyAssistant/Resources/Models/tts
        buildPhase: resources
        # Blue folder reference — the whole directory lands in the bundle
        # as tts/, preserving the sherpa layout (model + tokens +
        # espeak-ng-data/) and avoiding flat-copy filename collisions
        # between the two voices' identical espeak-ng-data contents.
        type: folder
      # Bundled wake-word KWS model (sherpa-layout dirs: encoder/decoder/
      # joiner-*.int8.onnx + tokens.txt + keywords.txt), loaded straight
      # from the bundle or installed into the ModelStore by
      # SherpaKWSWakeWordEngine. Gitignored — fetch with
      # tools/fetch-kws-model.sh before building (the P0 wake-word swap;
      # see docs/voice-personalisation-p0-plan.md slice A).
      - path: ElderlyAssistant/Resources/Models/kws
        buildPhase: resources
        # Blue folder reference (same rationale as tts/): the whole
        # directory lands in the bundle as kws/ — the layout both
        # SherpaKWSModelFile.bundledDirectory and the ModelStore kws
        # install expect.
        type: folder
      # Bundled per-locale number-word lexicons for the voice
      # number-word normalizer ([NUMBER-WORDS]): Resources/NumberWords/
      # <language-code>.json, one flat word + spelling-variants → integer
      # map per locale (schema + loader: Services/Voice/
      # NumberWordNormalizer.swift). Blue folder reference — the
      # directory lands in the bundle as NumberWords/ so adding a
      # language = dropping in a JSON file, no project.yml or parser
      # changes (same rationale as Manuals/ below).
      - path: ElderlyAssistant/Resources/NumberWords
        buildPhase: resources
        type: folder
      # Bundled default instruction manuals — Resources/Manuals/README.md.
      # Blue folder reference: the whole directory lands in the bundle as
      # Manuals/, preserving the layout BundledManualCatalog expects
      # (Manuals/manifest.json + Manuals/images/<app>/... jpgs).
      - path: ElderlyAssistant/Resources/Manuals
        buildPhase: resources
        type: folder
      # Bundled in-app user manual (user-manual-in-app task) — the
      # structured phone-friendly content behind Settings → Manuals →
      # "User manual". Blue folder reference (same rationale as Manuals/):
      # the directory lands in the bundle as ManualText/, the subdirectory
      # `UserManualCatalog.bundledSubdirectory` looks up
      # (ManualText/userManual.json).
      - path: ElderlyAssistant/Resources/ManualText
        buildPhase: resources
        type: folder
    # Do NOT add an `info:` block here — that would make XcodeGen overwrite
    # ElderlyAssistant/Info.plist on every `./build.sh generate`, wiping the
    # real permission descriptions and BGTaskScheduler identifiers. Instead,
    # point INFOPLIST_FILE at the plist we maintain by hand.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elderlyassistant.app
        PRODUCT_NAME: ElderlyAssistant
        INFOPLIST_FILE: ElderlyAssistant/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        SWIFT_OBJC_BRIDGING_HEADER: ""
        # Home-screen icon: AppIcon.appiconset (cropped from the user's
        # supplied artwork, 2026-09-08).
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    dependencies:
      # vDSP FFT for the spectral-gate denoiser ([NOISE-FILTER] P1
      # front-end, Services/Voice/SpectralGateCore.swift). Declared
      # explicitly rather than relied on transitively through WhisperKit.
      # `sdk:` (not `framework:`) — a system SDK framework is linked, not
      # embedded.
      - sdk: Accelerate.framework
      - package: SwiftWhisper
      - package: LLM
        product: LLM
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: WhisperKit
        product: WhisperKit
      - package: sherpa-onnx
        product: sherpa-onnx
      # [TIMER-ALARM] (2026-09-10) The widget extension hosting the
      # AlarmKit alarm presentation (ActivityConfiguration for
      # AlarmAttributes<TimerAlarmSystemMetadata>) — the system renders
      # system-managed timer countdowns and alerts through it.
      - target: TimerAlarmWidgetExtension
        embed: true

  # [TIMER-ALARM] (2026-09-10) WidgetKit extension for the AlarmKit
  # system-managed timer presentation. iOS-26-only by nature (AlarmKit is
  # iOS 26+); embedding a higher-minimum extension in an iOS-16 app is
  # supported — the extension simply never runs below iOS 26 and the
  # app's UN/in-app fallback paths cover those systems. Its Info.plist is
  # GENERATED here (unlike the app's hand-maintained plist — see the
  # warning on the app target): the extension declares nothing but the
  # widget-extension point and Live Activity support.
  TimerAlarmWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TimerAlarmWidget
      # The AlarmMetadata type must be the SAME type (same name) in the
      # app and the extension — ActivityKit matches the scheduled
      # AlarmAttributes to this widget by the attributes type. Standard
      # Live Activity pattern: both targets compile the one shared file.
      - path: ElderlyAssistant/Services/Alarms/TimerAlarmSystemShared.swift
    info:
      path: TimerAlarmWidget/Info.plist
      properties:
        CFBundleDisplayName: Timer Alarm
        # App extensions must declare the XPC! package type for the
        # system to load them.
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elderlyassistant.app.TimerAlarmWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO

  ElderlyAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ElderlyAssistantTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elderlyassistant.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ElderlyAssistant.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ElderlyAssistant"
    dependencies:
      - target: ElderlyAssistant

  ElderlyAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ElderlyAssistantUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elderlyassistant.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ElderlyAssistant

schemes:
  ElderlyAssistant:
    build:
      targets:
        ElderlyAssistant: all
        ElderlyAssistantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElderlyAssistantTests
        - ElderlyAssistantUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
